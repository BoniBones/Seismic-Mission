</script><script>window.RESEARCH_TEXT = "# Why Do Earthquakes Damage Some Places More Than Others?\n\n**Abstract**\n\nThe magnitude of an earthquake tells us how much energy is released, but it does not explain why some places suffer more damage than others. This research focuses on how different soil conditions and building structures can influence the damage caused by earthquakes. To investigate this, I analyzed information from two important earthquakes: Loma Prieta in 1989 and Christchurch in 2011. The results show that areas with soft or water-saturated soils can experience stronger shaking and liquefaction, which can seriously damage building foundations. Also, older buildings without proper reinforcement are generally more vulnerable than modern buildings designed to resist earthquakes. These findings suggest that earthquake damage depends not only on magnitude, but also on local ground conditions and the quality of buildings.\n\n**Introduction**\n\nWhen we hear about an earthquake, one of the first things we usually want to know is its magnitude. However, magnitude does not tell us everything about the damage it can cause. Sometimes, an earthquake can destroy an entire neighborhood while another area nearby suffers almost no damage.\n\nThis research investigates why this happens, focusing mainly on two factors: the type of ground where buildings are located and how those buildings are constructed. Understanding these differences is important because it can help us prevent damage in the future by improving building designs, choosing safer places for construction and using stronger foundations. The main hypothesis of this research is that earthquakes cause more damage in areas with weak soil conditions or poorly constructed buildings, even when other places experience the same earthquake. \n\nTo investigate this idea, we will focus on two predictions. First, areas with soft or wet soils should experience stronger shaking or more ground movement. Second, older or weaker buildings should suffer more damage than modern buildings in similar conditions. To test these predictions, I will use information and observations from two real earthquakes: the 1989 Loma Prieta earthquake in California and the 2011 Christchurch earthquake in New Zealand.\n\n# Theoretical Background\n\nBefore analyzing the earthquakes, it is important to understand the difference between magnitude and intensity. Magnitude measures the total energy released by an earthquake, so each earthquake has only one magnitude value. On the other hand, intensity describes how strongly the earthquake is felt in a particular location and the damage it produces there. This means that the same earthquake can have different intensity values depending on the area. Some important factors are the distance from the fault, the depth of the earthquake and the type of soil found in each location.\n\nSoil conditions can have a major influence on the damage caused by earthquakes. When seismic waves travel through soft soils, they can produce stronger shaking than when they travel through solid rock. Another important problem is liquefaction, which happens when loose, sandy soil containing a lot of water temporarily loses its strength during an earthquake and starts behaving almost like a liquid.When liquefaction occurs, the ground can sink, crack or move sideways. This can damage the foundations of buildings, roads and underground pipes, even when the structures above them are relatively strong.\n\nAnother important factor is the quality of the buildings themselves. Different structures react differently to earthquakes depending on their materials, height, weight and design. For example, old brick buildings without steel reinforcement are usually more vulnerable because their walls can separate from the floors or roofs during strong shaking. Modern buildings, especially those designed to resist earthquakes, usually perform better because they can absorb and distribute seismic forces more effectively. However, this does not mean that every modern building is completely safe. In general, earthquake damage depends on the combination of natural conditions and how vulnerable the buildings and infrastructure are.\n\n# Research\n\nFor this research, we used scientific reports and studies about two earthquakes that caused important damage in urban areas. These are the 1989 Loma Prieta earthquake in the United States and the 2011 Christchurch earthquake in New Zealand. The information comes mainly from reports published by the United States Geological Survey (USGS) and engineering studies carried out after the earthquakes.We compared three main aspects: the behavior of the soil, the damage suffered by different types of buildings, and other factors that could explain the results, such as the distance from the fault.\n\n## Loma Prieta in 1989\n\nOn October 17, 1989, a magnitude 6.9 earthquake struck California. Although a lot of damage occurred near the epicenter, some areas of Oakland and San Francisco, which were farther away, also experienced serious destruction. \n\nAccording to USGS investigations, soft soils increased the strength of shaking in some areas, sometimes making it about twice as strong. Researchers also found that wet sandy soils and artificial landfills around San Francisco Bay experienced liquefaction. One of the most affected locations was the Marina District in San Francisco. In this area, the soft ground made the shaking stronger, while liquefaction caused problems with the soil supporting the buildings. This is a good example of why magnitude alone cannot explain earthquake damage. Even places that are not very close to the epicenter can suffer serious destruction if the ground conditions are unfavorable. \n\nThe buildings themselves also played an important role. USGS reports showed that modern buildings designed to resist earthquakes generally performed better than older brick buildings without reinforcement. Another important example was the Cypress Street Viaduct in Oakland, which suffered a major collapse. Its structural weaknesses, together with the ground conditions, contributed to the severity of the damage.\n\nThese observations show that both soil conditions and construction quality are important when trying to understand why some areas are more affected than others.\n\n## Christchurch in 2011\n\nThe Christchurch earthquake of February 22, 2011, in New Zealand is another example of how damage can vary between different areas of the same city. After the earthquake, researchers found many signs of liquefaction, including sand coming up to the surface, cracks in the ground and areas where the soil had sunk.\n\nThe eastern suburbs of Christchurch were especially affected because they had wet, sandy soils that reacted badly to the strong shaking. According to engineering reports, ground movement damaged around 15,000 homes. In many cases, the buildings themselves had not been seriously damaged by the shaking, but the movement of the ground underneath them caused major problems.This shows that earthquakes do not always damage buildings directly. Sometimes, the biggest problem is that the ground supporting them becomes unstable.\n\nResearchers also inspected different types of buildings, including approximately 650 unreinforced brick buildings, 90 stone buildings without reinforcement and 342 concrete block buildings. Their observations showed that modern concrete-frame buildings generally performed better, while older unreinforced brick buildings suffered much more damage. However, two modern concrete office buildings also collapsed, showing that modern construction does not guarantee complete safety. \n\nAnother interesting point is the comparison with the 2010 Darfield earthquake. Even though the Darfield earthquake had a higher magnitude, the Christchurch earthquake caused much more severe damage in the city. One of the main reasons was that the 2011 earthquake occurred closer to the city center and at a shallower depth. This produced extremely strong shaking in urban areas.\n\nConsequently, the Christchurch earthquake shows that magnitude is not the only important factor. The location and depth of the earthquake, together with soil conditions and the quality of buildings, can have a major influence on the damage.\n\n# Discussion\n\nAfter analyzing both earthquakes, we found evidence supporting the two predictions presented in the introduction. In Loma Prieta, scientists observed that areas with soft soils experienced stronger shaking and liquefaction. They also found important differences between the performance of modern buildings and older brick structures.\n\nSomething similar happened in Christchurch, where researchers recorded severe ground movement in areas with wet, sandy soils. The building inspections also showed that structures without proper reinforcement were generally more vulnerable. These results suggest that local geological conditions and building quality play a very important role in determining how much damage an earthquake causes.\n\nHowever, there are other factors that must also be considered. For example, the distance from the fault and the strength of the shaking are clearly important. A building located very close to the fault can experience extreme shaking even if it is built on solid ground. Nevertheless, these factors do not explain every difference in damage. Soil liquefaction and structural weaknesses can make the situation much worse, even in areas located farther away.\n\nIt is also important to understand that soft soils do not always cause severe destruction and that modern buildings are not completely protected from earthquakes. Liquefaction, for example, only happens under certain soil and water conditions. Overall, the evidence shows that earthquake damage is the result of several factors working together, rather than just the magnitude of the event.\n\n# Conclusion\n\nIn conclusion, the research supports the hypothesis that earthquakes affect some places more seriously than others because of differences in soil conditions and building quality. The examples of Loma Prieta in 1989 and Christchurch in 2011 show that the magnitude of an earthquake does not determine how much damage every area will experience.\n\nOne of the most important factors is the type of ground. Soft soils can increase the strength of seismic shaking, while water-saturated sandy soils can experience liquefaction. This can make the ground unstable and cause serious problems for buildings, even in places that are not very close to the epicenter. Another important factor is how buildings are constructed. Older structures without proper reinforcement are generally more vulnerable to strong shaking, while modern buildings designed to resist earthquakes usually perform better.\n\nHowever, the research also shows that no single factor can completely explain earthquake damage. Distance from the fault, earthquake depth, local geology and construction quality all influence the final results.\n\nTherefore, we can conclude that the hypothesis is supported by the evidence from both earthquakes. Understanding these differences is important because it can help us design safer buildings, improve urban planning and reduce the damage caused by future earthquakes.\n\nThese findings also connect with Pope Francis’s message in Laudato Si’. He links housing to human dignity and calls for residents to take part in decisions about their neighbourhoods (Francis, 2015, paras. 150–152). Applied to earthquake risk, this means using scientific knowledge to plan safer communities and improve vulnerable buildings.\n\nFrancis also argues that the common good requires special concern for the poorest (2015, para. 158). In earthquake preparation, this means helping families who cannot afford safer homes or repairs. Although we cannot stop tectonic earthquakes, responsible planning and fair access to protection can reduce suffering and show care for our common home.\n\n**Bibliography**\n\n(2026, October 13). Earthquake loma prieta California 1989, Nisit.gov. \n\n[https://www.nist.gov/el/earthquake-loma-prieta-california-1989](https://www.nist.gov/el/earthquake-loma-prieta-california-1989) \n\n(2026, October 13). Christchurch earthquake, New Zealand 2011, knowledge.aidr.org.au \n\n[https://knowledge.aidr.org.au/resources/earthquake-christchurch-new-zealand-2011/](https://knowledge.aidr.org.au/resources/earthquake-christchurch-new-zealand-2011/) \n\n(2026, October 13). Christchurch earthquake kills 185, nzhistory.govt.nz \n\n[https://www.usgs.gov/faqs/why-do-earthquakes-other-countries-seem-cause-more-damage-and-casualties-earthquakes-us](https://www.usgs.gov/faqs/why-do-earthquakes-other-countries-seem-cause-more-damage-and-casualties-earthquakes-us) \n\n(2026, October 13). What is the difference between earthquake magnitude and earthquake intensity? What is the Modified Mercalli intensity scale? usgs.gov \n\n[https://www.usgs.gov/faqs/what-difference-between-earthquake-magnitude-and-earthquake-intensity-what-modified-mercalli](https://www.usgs.gov/faqs/what-difference-between-earthquake-magnitude-and-earthquake-intensity-what-modified-mercalli) \n\n(2026, October 13). M 6.9 October 17, 1989 Loma prieta earthquake, usgs.gov \n\n[https://www.usgs.gov/programs/earthquake-hazards/science/m-69-october-17-1989-loma-prieta-earthquake](https://www.usgs.gov/programs/earthquake-hazards/science/m-69-october-17-1989-loma-prieta-earthquake) \n\nFrancis. (2015, May 24). *Laudato si’*. Vatican. https://www.vatican.va/content/francesco/en/encyclicals/documents/papa-francesco_20150524_enciclica-laudato-si.html\n\n";

const defaults=()=>({step:0,lang:'es',teacher:false,vote:null,case:'loma',selected:[],twist:false,reflection:'',science:'',team:'',remaining:180,running:false,soil:'rock',design:'good',labRuns:0,visited:['loma']});

function cases(){
 const item=MISSION.cases[state.case],l=state.case==='loma';
 return head(tr('03 / Evidencia real','03 / Real evidence'),tr('Dos ciudades. La misma pregunta.','Two cities. The same question.'))+box('tabs',btn('Loma Prieta · 1989',"setCase('loma')",l?'selected':'')+btn('Christchurch · 2011',"setCase('christchurch')",!l?'selected':''))+box('split','<div>'+box('big accent',item.year)+p(item.date,'tag')+h(t(item.title))+p(t(item.intro),'lede')+'</div>'+box('panel',box('tag',tr('PISTA CENTRAL','KEY CLUE'))+p(t(item.clue),'quote')+'<a target="_blank" rel="noopener" href="'+MISSION.sources[item.source][1]+'">'+tr('Abrir fuente original','Open original source')+' ↗</a>'))+box('evidence',[['ground',tr('Terreno','Ground')],['buildings',tr('Construcción','Construction')],['limits',tr('Otras variables','Other variables')]].map(([key,label])=>'<article>'+h(label)+p(t(item[key]))+'</article>').join(''))+detail(t(MISSION.science[3].title),t(MISSION.science[3].text))+box('actions',btn(tr('Leer la investigación completa','Read the complete research'),'openPaper()'))+p(tr('Texto original en inglés, con el desarrollo completo y su bibliografía.','Original English text, including the full argument and bibliography.'),'small');
},
function council(){
 return head(tr('04 / Ahora decide el curso','04 / Your class decides'),tr('10 créditos.<br>¿Qué protegemos primero?','10 credits.<br>What comes first?'),tr('Equipos de 3–4. Una persona calcula, otra revisa la ciencia y otra representa a los vecinos. Armen un plan en papel y registren aquí la decisión del curso.','Teams of 3–4. One person handles the budget, another checks the science, another represents residents. Plan on paper, then record the class decision here.'))+box('split','<div>'+box('choices',choiceList())+p(tr('Ciudad y costos ficticios. Sitios a distancia parecida de la falla. Cada acción se compra una vez. No se predicen vidas salvadas.','Fictional town and costs. Sites have similar fault distance. Each action can be selected once. No lives-saved prediction.'),'small')+'</div>'+box('panel',box('budget','<span>'+tr('Invertido','Allocated')+'</span><strong>'+total()+' / 10</strong>')+'<progress max="10" value="'+total()+'" aria-label="'+tr('Presupuesto utilizado','Budget used')+'"></progress>'+p(tr('Pueden dejar créditos sin gastar. No pueden gastar más de 10.','You may leave credits unspent. You may not exceed 10.'))+box('actions','<span class="timer" id="clock">'+clock()+'</span>'+btn(state.running?tr('Pausa','Pause'):tr('Iniciar tiempo','Start timer'),'timerToggle()')+btn(tr('Reiniciar','Reset'),'timerReset()'))+'<label class="field" for="team">'+tr('Equipo o curso','Team or class')+'</label><input id="team" type="text" maxlength="60" value="'+esc(state.team)+'" placeholder="3.º B"><label class="field" for="science">'+tr('Nuestra razón científica','Our scientific reason')+'</label><textarea id="science" maxlength="1600" placeholder="'+tr('Elegimos... porque...','We chose... because...')+'">'+esc(state.science)+'</textarea>'));
},
function human(){
 return head(tr('05 / Más allá de los edificios','05 / Beyond the buildings'),tr('Los números tienen vecinos','The numbers have neighbours'),tr('La ciencia ayuda a entender el riesgo. También tenemos que decidir cómo compartir la protección.','Science helps us understand risk. We also have to decide how to share protection.'))+btn(state.twist?tr('Información revelada','Information revealed'):tr('Abrir el mensaje de los vecinos','Open the residents’ message'),'reveal()','primary')+(state.twist?box('answer',h(tr('“No podemos pagar las reparaciones.”','“We cannot afford the repairs.”'))+p(tr('Las familias dependen de ayuda pública. Además, la escuela será el refugio de emergencia del pueblo.','The families depend on public assistance. The school will also serve as the town’s emergency shelter.'))+p(tr('Mensaje ficticio para debatir. No es testimonio de una víctima real.','Fictional message for discussion. Not testimony from a real victim.'),'small')):'')+box('split','<div>'+box('tag','LAUDATO SI’ / 2015')+p(tr('¿Una vivienda más segura debería depender de cuánto podés pagar?','Should a safer home depend on how much you can pay?'),'quote')+p(tr('Francisco relaciona la vivienda con la dignidad humana y pide escuchar a quienes habitan los barrios (§§150–152). El bien común requiere especial atención a los más pobres (§158).','Francis connects housing with human dignity and asks planners to hear residents (§§150–152). The common good requires special concern for the poorest (§158).'))+p(tr('Aplicamos estos principios a la prevención sísmica. La encíclica no es un manual técnico ni afirma que la contaminación cause los terremotos tectónicos.','We apply these principles to earthquake preparedness. The encyclical is not a technical manual and does not claim pollution causes tectonic earthquakes.'),'small')+'</div><div>'+h(tr('¿Mantienen el plan?','Will you keep your plan?'))+box('choices',choiceList())+p(total()+' / 10 '+tr('créditos','credits'),'accent')+'</div>')+'<label class="field" for="reflection">'+tr('A quién protege nuestro plan y qué riesgo deja pendiente','Who our plan protects and what risk remains')+'</label><textarea id="reflection" maxlength="1600" placeholder="'+tr('Mantenemos / cambiamos el plan porque...','We kept / changed our plan because...')+'">'+esc(state.reflection)+'</textarea>';
},
function debrief(){
 return head(tr('06 / La conclusión es de ustedes','06 / The conclusion is yours'),tr('Una decisión defendible.<br>Riesgos que siguen presentes.','A defensible decision.<br>Risks that still remain.'),tr('La evidencia apoya la hipótesis: el terreno y la construcción ayudan a explicar por qué algunos lugares sufren más. Profundidad, distancia e intensidad local también importan.','The evidence supports the hypothesis: ground and construction help explain why some places suffer more. Depth, distance and local intensity matter too.'))+box('split',box('panel',box('tag',esc(state.team||tr('PLAN DEL CURSO','CLASS PLAN')))+box('budget','<strong>'+total()+' / 10</strong><span>'+(state.selected.join(' + ')||tr('Sin decisiones','No choices yet'))+'</span>')+p(esc(state.science||tr('Falta explicar la razón científica. Volvé al consejo para completarla.','A scientific reason is missing. Return to the council to add one.')))+p(esc(state.reflection||tr('Falta justificar a quién beneficia el plan.','The explanation of who benefits is still missing.'))))+'<div>'+h(tr('Lo que el plan deja pendiente','What the plan leaves unresolved'))+'<ul class="risk">'+risks().map(r=>'<li>'+r+'</li>').join('')+'</ul></div>')+box('flat',h(tr('Última ronda: 20 segundos por equipo','Final round: 20 seconds per team'))+p(tr('“Antes pensábamos ___. Ahora sostenemos ___, porque la evidencia ___.”','“We used to think ___. Now we argue ___, because the evidence ___.”'),'quote'))+box('actions',btn(tr('Descargar informe de la misión','Download mission report'),'downloadReport()','primary')+btn(tr('Investigación completa','Full research paper'),'openPaper()')+btn(tr('Nueva clase','New class'),'resetMission()'))+p(storageAvailable?tr('Las decisiones se guardan sólo en este navegador. El informe registra argumentos, no predicciones de daños.','Decisions are saved only in this browser. The report records arguments, not damage predictions.'):tr('El navegador no permite guardar el progreso. Descargá el informe antes de cerrar.','This browser cannot save progress. Download the report before closing.'),'small');
}
];
render();

</script></body></html>
