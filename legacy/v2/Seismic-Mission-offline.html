<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seismic Mission · Why do earthquakes damage some places more than others?</title>
<style>
:root{--bg:#0a1120;--p:#111b2f;--l:#23324f;--tx:#e9effc;--mu:#9db0d3;--a:#ffb347;--c:#4fd1e8;--g:#7bdc9b;--r:#ff7070;font-size:min(1.3vw,2.3vh)}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-rows:auto 4px 1fr auto;overflow:hidden;background:radial-gradient(70rem 30rem at 85% -10%,#1d2f5c,var(--bg));color:var(--tx);font:1rem/1.45 "Segoe UI",system-ui,sans-serif}
header,footer{display:flex;align-items:center;gap:1rem;padding:.55rem 1.8rem}
header svg{flex:1;height:2rem;min-width:0}
b{letter-spacing:.02em}.lg{letter-spacing:.22em}.lg i{color:var(--a);font-style:normal;margin:0 .35em}
button{font:inherit;background:var(--p);color:var(--tx);border:1px solid var(--l);border-radius:.5rem;padding:.3rem .9rem;cursor:pointer}
button:hover:not(:disabled){border-color:var(--c)}button:focus-visible{outline:3px solid var(--c);outline-offset:2px}button:disabled{opacity:.35;cursor:default}
.pri{background:var(--a);border-color:var(--a);color:#1b1300;font-weight:700}.on{border-color:var(--a);background:#3a2c0c;color:var(--a)}
#te{font-size:.75rem;opacity:.7}
#bar{background:var(--l)}#bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--a));transition:width .4s}
main{overflow:auto;padding:1rem 3.5rem}
.sl{max-width:78rem;margin:auto;animation:in .45s ease both}@keyframes in{from{opacity:0;transform:translateY(.7rem)}}
h1{font-size:3rem;line-height:1.08;margin:.3rem 0 .8rem}h1 em{color:var(--a);font-style:normal}h2{font-size:2.1rem;margin:.1rem 0 .7rem}
.k{color:var(--c);font:600 .75rem ui-monospace,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;margin:0 0 .3rem}
.lead{font-size:1.35rem;color:var(--mu);max-width:56rem}.ask{margin-top:1rem;padding:.7rem 1.1rem;border-left:4px solid var(--a);background:#1a2238;font-size:1.15rem}
.g{display:grid;gap:1rem}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--p);border:1px solid var(--l);border-radius:.8rem;padding:.9rem 1.2rem}.card p{margin:.25rem 0}
.big{font-size:2.2rem;font-weight:800;color:var(--a);line-height:1}
.row{display:grid;grid-template-columns:19rem 1fr 3rem 5.5rem;gap:.8rem;align-items:center;margin:.35rem 0}
.bt{height:1.1rem;background:var(--l);border-radius:1rem;overflow:hidden}.bf{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--a));transition:width .5s}
.ok{border-color:var(--g)!important;background:#12301f!important}.no{border-color:var(--r)!important}.mu,small{color:var(--mu)}
.sc{width:100%;border-radius:.8rem;background:#0d1a33;border:1px solid var(--l)}
.sh #all{animation:sk .09s infinite alternate}.sh.w #bd{animation:sn 3s forwards}
@keyframes sk{from{transform:translateX(calc(var(--a)*-1px))}to{transform:translateX(calc(var(--a)*1px))}}
@keyframes sn{to{transform:translateY(14px) rotate(7deg)}}
textarea,input,select{font:inherit;background:#0b1428;color:var(--tx);border:1px solid var(--l);border-radius:.4rem;padding:.35rem .6rem;width:100%}
#tm{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9}#tm[hidden]{display:none}
#tb{background:var(--p);border:1px solid var(--l);border-radius:1rem;padding:1.2rem 1.6rem;width:min(70rem,94vw);max-height:92vh;overflow:auto}
.s4{display:flex;gap:.4rem}.s4 button{flex:1;padding:.25rem}.opt{display:block;width:100%;text-align:left;margin:.5rem 0;font-size:1.2rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,footer,#bar,.np,#tm{display:none!important}body{display:block;height:auto;overflow:visible;background:#fff;color:#000}main{overflow:visible;padding:0}.card{background:#fff;border-color:#888}.bt{background:#ddd}.bf{background:#456}.k,.mu,small{color:#333}}
</style></head><body>
<header><b class="lg">SEISMIC<i>/</i>MISSION</b><svg id="wave" viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#4fd1e8" stroke-width="1.5"/></svg><button id="te" onclick="TM(1)" title="Shortcut: E">Teacher evaluation <span id="tstat"></span></button><button onclick="fs()" aria-label="Full screen" title="Shortcut: F">⛶</button></header>
<div id="bar"><i></i></div><main id="stage" tabindex="-1"></main>
<footer><button id="pv" onclick="go(S.i-1)">← Back</button><nav id="dots" style="flex:1;display:flex;gap:.45rem;justify-content:center"></nav><button id="nx" class="pri" onclick="go(S.i+1)">Next →</button></footer>
<div id="tm" hidden role="dialog" aria-modal="true" aria-label="Teacher evaluation"><div id="tb"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const O=['Magnitude vs intensity','Soft ground shakes harder','Liquefaction','Building quality','Distance and depth'];
const R=[['I understand the main ideas of the research',['Not sure yet','I know some terms','I understand most ideas','I could explain them to a friend']],
['I can explain at least one new concept',['I cannot name one','I can name one, not explain it','I can explain one clearly','I can explain several, with examples']],
['I can link the research to real situations',['I cannot see a link','I see a weak link','I can link it to a real case','I can link it to cases and city planning']],
['My knowledge improved during this session',['Not at all','A little','Clearly','A lot']],
['The presentation was engaging and clear',['Hard to follow','Sometimes clear','Mostly clear','Very clear and engaging']]];
const F=[['Which concept was the most interesting?',O],['Which concept do you understand best now?',O],['Which topic would you like to investigate further?',O],...R.map(r=>[r[0],r[1],1])];
const T=[['Scientific accuracy','Was the information correct and supported by research?'],['Clarity of communication','Were explanations understandable for 15–16-year-olds?'],['Student engagement','Did it hold attention and encourage participation?'],['Educational value','Did students show understanding of new concepts?'],['Presentation structure','Was the content logical and well delivered?'],['Interactive activities','Did the activities contribute meaningfully to learning?'],['Visual and technical quality','Did the website support rather than distract?']];
const SCL=['Not yet','Partly','Good','Excellent'];
const G={rock:['Solid rock','#5d6b86',3,'Waves travelling through solid rock produce weaker shaking than through soft soil.'],soft:['Soft soil','#9a7a3e',6,'Soft soil can make shaking stronger — in some Loma Prieta areas about twice as strong (USGS).'],wet:['Wet sandy soil','#3b7ea1',6,'Loose, water-saturated sand can liquefy: it loses strength and behaves almost like a liquid. The ground can sink, crack or move sideways.']};
const B={modern:['Modern, earthquake-resistant','Absorbs and distributes seismic forces better — but modern is no guarantee: two modern concrete offices collapsed in Christchurch.'],old:['Old brick, no steel reinforcement','Walls can separate from floors or roofs during strong shaking.']};
const CH=[['The Marina District (San Francisco) was among the worst-hit places in 1989. Why?',['The earthquake was stronger there','Soft ground amplified the shaking and liquefaction weakened the soil','Every building there was brand new'],1,'Soft soils increased shaking and wet sandy fill liquefied. Magnitude alone cannot explain damage.'],
['Darfield (2010) had a higher magnitude. Why did Christchurch (2011) damage the city more?',['It struck closer to the city centre and at a shallower depth','It released more energy','It only hit older buildings'],0,'Closer and shallower meant extremely strong shaking in urban areas.'],
['Around 15,000 Christchurch homes were damaged by ground movement. What was the main problem?',['Walls collapsed from shaking alone','The wet, sandy ground became unstable (liquefaction)','The roofs were too heavy'],1,'Often the buildings were not seriously damaged by shaking itself — the ground under them moved.']];
const SRC=[['NIST · Loma Prieta','https://www.nist.gov/el/earthquake-loma-prieta-california-1989'],['USGS · M6.9 Loma Prieta','https://www.usgs.gov/programs/earthquake-hazards/science/m-69-october-17-1989-loma-prieta-earthquake'],['AIDR · Christchurch 2011','https://knowledge.aidr.org.au/resources/earthquake-christchurch-new-zealand-2011/'],['USGS · magnitude vs intensity','https://www.usgs.gov/faqs/what-difference-between-earthquake-magnitude-and-earthquake-intensity-what-modified-mercalli'],['USGS · damage in other countries','https://www.usgs.gov/faqs/why-do-earthquakes-other-countries-seem-cause-more-damage-and-casualties-earthquakes-us']];
let S={};try{S=JSON.parse(localStorage.getItem('sm1'))||{}}catch(e){}
S=Object.assign({i:0,q:0,v:{},ch:{},nt:[],g:'rock',b:'modern',t:{}},S);
S.t=Object.assign({s:{},st:'',im:'',cm:'',nm:'',ov:0,done:false},S.t);
if(!Array.isArray(S.nt))S.nt=[];if(!G[S.g])S.g='rock';if(!B[S.b])S.b='modern';S.q=Math.min(Math.max(+S.q||0,0),F.length-1);
const save=()=>{try{localStorage.setItem('sm1',JSON.stringify(S))}catch(e){}};
const sm=a=>a.reduce((x,y)=>x+y,0),cn=i=>(S.v[i]=Array.isArray(S.v[i])?S.v[i]:F[i][1].map(()=>0)),av=i=>{const c=cn(i),n=sm(c);return n?(c.reduce((x,y,j)=>x+y*(j+1),0)/n).toFixed(2):null};
const tavg=()=>{const v=Object.values(S.t.s).map(Number).filter(x=>x>0);return v.length?(sm(v)/v.length).toFixed(2):null};
const fx=i=>sm(cn(i))+' hands counted'+(F[i][2]&&av(i)?' · average '+av(i)+' / 4':'');
const fc=(b,t)=>'<div class="card"><p class="big">'+b+'</p><p>'+t+'</p></div>';
const wv=a=>{let p='';for(let x=0;x<=600;x+=4)p+=x+','+(30+Math.sin(x/37)*Math.sin(x/8.3)*a*(.35+Math.abs(Math.sin(x/95)))).toFixed(1)+' ';$('#wave polyline').setAttribute('points',p)};
/* ---------- Lab ---------- */
function lab(){const g=G[S.g],b=B[S.b];return '<div class="g c2"><div><svg class="sc" id="sc" viewBox="0 0 400 230" style="--a:'+g[2]+'"><g id="all"><rect x="0" y="150" width="400" height="80" fill="'+g[1]+'"/>'+(S.g=='wet'?'<path d="M0 175q25-8 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0" stroke="#bfe9ff" fill="none" opacity=".6"/>':'')+'<g id="bd"><rect x="150" y="70" width="100" height="80" fill="'+(S.b=='old'?'#b5553c':'#4fd1e8')+'"/><path d="M150 150l100-80M250 150l-100-80" stroke="#0a1120" stroke-width="4" opacity="'+(S.b=='old'?0:.7)+'"/><path d="M175 70l12 30-14 22 10 28" stroke="#2a0d07" stroke-width="3" fill="none" opacity="'+(S.b=='old'?.9:0)+'"/></g></g></svg><p><button class="pri" onclick="quake()">Trigger earthquake</button> <small>Conceptual model, not a simulation.</small></p></div><div><p class="k">1 · Ground</p><div class="s4">'+Object.keys(G).map(k=>'<button class="'+(S.g==k?'on':'')+'" onclick="lb(\'g\',\''+k+'\')">'+G[k][0]+'</button>').join('')+'</div><p class="k" style="margin-top:.8rem">2 · Building</p><div class="s4">'+Object.keys(B).map(k=>'<button class="'+(S.b==k?'on':'')+'" onclick="lb(\'b\',\''+k+'\')">'+B[k][0]+'</button>').join('')+'</div><div class="card" style="margin-top:.8rem"><p class="k">Ground</p><p>'+g[3]+'</p><p class="k">Building</p><p>'+b[1]+'</p></div><div class="ask">'+(S.g=='wet'?'Foundations can fail from below, even if the structure above is strong.':S.g=='soft'?'Stronger shaking reaches the building.':'The lowest shaking of the three grounds.')+(S.b=='old'?' Unreinforced walls are the weak point.':'')+'</div></div></div>'}
const lb=(k,v)=>{S[k]=v;save();$('#lb').innerHTML=lab()};
function quake(){const s=$('#sc');s.setAttribute('class','sc sh'+(S.g=='wet'?' w':''));wv(G[S.g][2]*5);clearTimeout(quake.t);quake.t=setTimeout(()=>{s.setAttribute('class','sc');wv(2)},3200)}
/* ---------- Challenge ---------- */
let cs={i:0,p:-1,r:0};
function chl(){const c=CH[cs.i];return '<p class="k">Class challenge '+(cs.i+1)+' / '+CH.length+'</p><h2 style="font-size:1.7rem">'+c[0]+'</h2>'+c[1].map((o,j)=>'<button class="card opt '+(cs.r?(j==c[2]?'ok':j==cs.p?'no':''):j==cs.p?'on':'')+'" onclick="cp('+j+')">'+String.fromCharCode(65+j)+' · '+o+'</button>').join('')+'<p><button class="pri" onclick="cr()">'+(cs.r?(cs.i<CH.length-1?'Next challenge →':'Continue →'):'Reveal answer')+'</button> <small>The class discusses and raises hands. Click the option most chose, then reveal.</small></p>'+(cs.r?'<div class="ask">'+(cs.p==c[2]?'The class got it. ':cs.p<0?'':'Not quite. ')+c[3]+'</div>':'')}
const cp=j=>{if(!cs.r){cs.p=j;$('#ch').innerHTML=chl()}};
function cr(){if(!cs.r)cs.r=1;else if(cs.i<CH.length-1)cs={i:cs.i+1,p:-1,r:0};else return go(S.i+1);$('#ch').innerHTML=chl()}
/* ---------- Class feedback (hand-raise tally entered by the presenter) ---------- */
function fb(){const f=F[S.q],c=cn(S.q),mx=Math.max(1,...c);return '<p class="k">Peer feedback · '+(f[2]?'reflection rubric 1–4':'class vote')+' · '+(S.q+1)+' / '+F.length+'</p><h2 style="font-size:1.8rem">'+f[0]+'</h2>'+f[1].map((o,j)=>'<div class="row"><span>'+(f[2]?(j+1)+' · ':'')+E(o)+'</span><span class="bt"><i class="bf" id="bf'+j+'" style="width:'+c[j]/mx*100+'%"></i></span><b id="cv'+j+'" style="text-align:right">'+c[j]+'</b><span><button onclick="vt('+j+',-1)" aria-label="Remove one">−</button> <button class="pri" onclick="vt('+j+',1)" aria-label="Add one">+</button></span></div>').join('')+'<p class="mu" id="fs1">'+fx(S.q)+' · counted by show of hands, so not anonymous.</p><p><button onclick="fq(-1)" '+(S.q?'':'disabled')+'>← Previous question</button> <button class="pri" onclick="fq(1)">'+(S.q<F.length-1?'Next question →':'Finish feedback →')+'</button> <button onclick="go(S.i+1)">Skip activity</button></p>'}
function vt(j,d){const c=cn(S.q);c[j]=Math.max(0,c[j]+d);save();const mx=Math.max(1,...c);c.forEach((v,k)=>{$('#bf'+k).style.width=v/mx*100+'%';$('#cv'+k).textContent=v});$('#fs1').textContent=fx(S.q)+' · counted by show of hands, so not anonymous.'}
function fq(d){if(S.q+d>=F.length)return go(S.i+1);S.q=Math.max(0,S.q+d);save();$('#fb').innerHTML=fb();const c=cn(S.q),mx=Math.max(1,...c);requestAnimationFrame(()=>c.forEach((v,k)=>{const e=$('#bf'+k);e.style.width='0%';requestAnimationFrame(()=>e.style.width=v/mx*100+'%')}))}
/* ---------- Reflection ---------- */
function rf(){return '<div class="g c2"><div><p class="k">Concepts students mention · tap + for each mention</p>'+O.map((o,j)=>'<div class="row" style="grid-template-columns:1fr 3rem 5.5rem"><span>'+o+'</span><b id="ck'+j+'">'+(S.ch[j]||0)+'</b><span><button onclick="ck('+j+',-1)" aria-label="Remove one">−</button> <button class="pri" onclick="ck('+j+',1)" aria-label="Add one">+</button></span></div>').join('')+'</div><div><p class="k">Optional short answers, typed by the presenter</p><input id="ni" maxlength="120" placeholder="Type a short answer and press Enter" onkeydown="if(event.key==\'Enter\')na()"><ul id="nl">'+nl()+'</ul></div></div>'}
const nl=()=>S.nt.map((n,k)=>'<li>'+E(n)+' <button onclick="nd('+k+')" aria-label="Delete answer" style="padding:0 .4rem">×</button></li>').join('');
const ck=(j,d)=>{S.ch[j]=Math.max(0,(S.ch[j]||0)+d);save();$('#ck'+j).textContent=S.ch[j]};
function na(){const v=$('#ni').value.trim();if(v&&S.nt.length<40){S.nt.push(v.slice(0,120));save();$('#ni').value='';$('#nl').innerHTML=nl()}}
const nd=k=>{S.nt.splice(k,1);save();$('#nl').innerHTML=nl()};
/* ---------- Teacher evaluation ---------- */
let rv=0;
const dn=()=>{S.t.done=false;save();ts()};
const ts=()=>{$('#tstat').textContent=S.t.done?'✓ completed':Object.keys(S.t.s).length?'· in progress':''};
const ts1=(i,v)=>{S.t.s[i]=v;dn();tf()};
function trep(){const t=S.t,a=tavg();return '<p>'+T.map((c,i)=>E(c[0])+': <b>'+(t.s[i]?t.s[i]+' / 4 ('+SCL[t.s[i]-1]+')':'not rated')+'</b>').join('<br>')+'</p><p>Average of rated criteria: <b>'+(a||'—')+'</b> / 4'+(t.ov?' · Overall assessment chosen: <b>'+t.ov+' / 4</b>':'')+'</p>'+[['Strengths',t.st],['Suggested improvements',t.im],['General comment',t.cm],['Evaluator (optional)',t.nm]].filter(x=>x[1]).map(x=>'<p><b>'+x[0]+':</b> '+E(x[1])+'</p>').join('')}
function tf(){const t=S.t;if(rv){$('#tb').innerHTML='<h2>Review before saving</h2>'+trep()+'<p><button onclick="rv=0;tf()">← Edit</button> <button class="pri" onclick="tsv()">Confirm and save</button></p>';return}
$('#tb').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Faculty evaluation</h2><span>'+(t.done?'<b style="color:var(--g)">✓ Completed and saved</b>':'<small>Not saved yet</small>')+' <button onclick="TM(0)">Close ✕</button></span></div><p class="mu">Scale: 1 Not yet (major gaps) · 2 Partly (some gaps) · 3 Good (minor gaps) · 4 Excellent (fully met)</p>'+T.map((c,i)=>'<div class="row" style="grid-template-columns:22rem 1fr"><span><b>'+c[0]+'</b><br><small>'+c[1]+'</small></span><span class="s4">'+SCL.map((s,j)=>'<button class="'+(t.s[i]==j+1?'on':'')+'" aria-pressed="'+(t.s[i]==j+1)+'" onclick="ts1('+i+','+(j+1)+')">'+(j+1)+' · '+s+'</button>').join('')+'</span></div>').join('')+'<div class="g c2" style="margin-top:.6rem"><label>Strengths<textarea rows="2" oninput="S.t.st=this.value;dn()">'+E(t.st)+'</textarea></label><label>Suggested improvements<textarea rows="2" oninput="S.t.im=this.value;dn()">'+E(t.im)+'</textarea></label><label>General comment (optional)<textarea rows="2" oninput="S.t.cm=this.value;dn()">'+E(t.cm)+'</textarea></label><div><label>Overall assessment (optional)<select onchange="S.t.ov=+this.value;dn()">'+[0,1,2,3,4].map(v=>'<option value="'+v+'"'+(t.ov==v?' selected':'')+'>'+(v?v+' · '+SCL[v-1]:'No overall rating')+'</option>').join('')+'</select></label><label>Name (optional)<input maxlength="60" value="'+E(t.nm)+'" oninput="S.t.nm=this.value;dn()"></label></div></div><p><button class="pri" onclick="rv=1;tf()">Review evaluation →</button></p>'}
function tsv(){S.t.done=true;S.t.at=new Date().toLocaleString();save();rv=0;TM(0);ts();if(S.i==SL.length-1)go(S.i)}
function TM(o){$('#tm').hidden=!o;if(o){rv=0;tf();$('#tb').focus&&0}}
/* ---------- Summary and export ---------- */
function sum(){const t=S.t,bars=i=>{const c=cn(i),mx=Math.max(1,...c);return F[i][1].map((o,j)=>'<div class="row" style="grid-template-columns:15rem 1fr 3rem"><span>'+E(o)+'</span><span class="bt"><i class="bf" style="width:'+c[j]/mx*100+'%"></i></span><b>'+c[j]+'</b></div>').join('')};
return '<p class="k">Presentation evaluation summary</p><h2>What the class and the teacher reported</h2><div class="g c2"><div class="card"><p class="k">Students · class tally by show of hands</p>'+[0,1,2].map(i=>'<p><b>'+F[i][0]+'</b> <small>'+sm(cn(i))+' votes</small></p>'+bars(i)).join('')+'</div><div class="card"><p class="k">Students · reflection rubric (1–4)</p>'+R.map((r,k)=>'<p>'+r[0]+' — <b>'+(av(k+3)?av(k+3)+' / 4':'not recorded')+'</b> <small>('+sm(cn(k+3))+' hands)</small></p>').join('')+'<p class="k">Concepts students reported learning</p><p>'+(O.map((o,j)=>S.ch[j]?E(o)+' ×'+S.ch[j]:'').filter(Boolean).join(' · ')||'<small>none recorded</small>')+'</p>'+(S.nt.length?'<p class="k">Short answers</p><ul>'+S.nt.map(n=>'<li>'+E(n)+'</li>').join('')+'</ul>':'')+'</div></div><div class="card" style="margin-top:1rem"><p class="k">Teacher judgement · '+(t.done?'completed'+(t.at?' '+E(t.at):''):'not completed')+'</p>'+(t.done?trep():'<small>No teacher evaluation has been saved.</small>')+'</div><p class="np"><button class="pri" onclick="TM(1)">Teacher evaluation</button> <button onclick="csv()">Download CSV</button> <button onclick="jsn()">Download JSON</button> <button onclick="print()">Print report</button> <button onclick="rs()">Erase all data</button></p>'}
const q=s=>{s=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
function rows(){const r=[['source','item','option_or_level','value']];F.forEach((f,i)=>{cn(i).forEach((c,j)=>r.push([f[2]?'student_rubric':'student_vote',f[0],(f[2]?(j+1)+' - ':'')+f[1][j],c]));if(f[2]&&av(i))r.push(['student_rubric_average',f[0],'',av(i)])});O.forEach((o,j)=>r.push(['student_concept_learned',o,'',S.ch[j]||0]));S.nt.forEach(n=>r.push(['student_answer',n,'','']));
if(S.t.done){T.forEach((c,i)=>S.t.s[i]&&r.push(['teacher_score',c[0],SCL[S.t.s[i]-1],S.t.s[i]]));[['teacher_average','',tavg()],['teacher_overall','',S.t.ov||''],['teacher_strengths','',S.t.st],['teacher_improvements','',S.t.im],['teacher_comment','',S.t.cm],['teacher_name','',S.t.nm]].forEach(x=>r.push([x[0],'',x[1],x[2]]))}return r}

const SL=[
{n:'Mission',h:()=>'<p class="k">Mission briefing</p><h1>Same earthquake.<br><em>Very different damage.</em></h1><p class="lead">Magnitude tells us how much energy an earthquake releases. It does not tell us why one neighbourhood is destroyed while another nearby suffers almost nothing.</p><div class="g c2"><div class="card"><p class="k">Hypothesis</p><p>Earthquakes cause more damage where the ground is weak or buildings are poorly constructed — even when other places feel the same earthquake.</p></div><div class="card"><p class="k">Two predictions</p><p>1 · Soft or wet soils → stronger shaking and ground movement.</p><p>2 · Older, weaker buildings → more damage than modern ones.</p></div></div><div class="ask">Ask the class: what would you check first, the ground or the building?</div>'},
{n:'Concepts',h:()=>'<p class="k">Key concepts</p><h2>Magnitude is one number. Intensity depends on where you are.</h2><div class="g c2"><div class="card"><p class="big">1 value</p><p><b>Magnitude</b> measures the total energy released. Each earthquake has only one.</p></div><div class="card"><p class="big">Many values</p><p><b>Intensity</b> describes how strongly the earthquake is felt, and the damage produced, in a particular location.</p></div></div><div class="ask">Intensity changes with: distance from the fault · depth of the earthquake · type of soil.</div>'},
{n:'Ground lab',h:()=>'<p class="k">Lab · the presenter operates</p><h2>Ground + building = damage</h2><div id="lb">'+lab()+'</div>',a:()=>wv(2)},
{n:'Loma Prieta',h:()=>'<p class="k">Case file 1 · California</p><h2>Loma Prieta · 17 October 1989 · magnitude 6.9</h2><p class="lead">Much damage near the epicentre, but parts of Oakland and San Francisco, farther away, were also seriously destroyed.</p><div class="g c3">'+fc('≈ 2×','USGS: soft soils increased the strength of shaking in some areas, sometimes about twice as strong.')+fc('Liquefaction','Wet sandy soils and artificial landfills around San Francisco Bay liquefied. Marina District: stronger shaking plus weakened ground under buildings.')+fc('Buildings','Modern earthquake-resistant buildings generally performed better than older unreinforced brick.')+'</div><div class="ask">Cypress Street Viaduct, Oakland: major collapse — structural weaknesses combined with ground conditions.</div>'},
{n:'Christchurch',h:()=>'<p class="k">Case file 2 · New Zealand</p><h2>Christchurch · 22 February 2011</h2><div class="g c3">'+fc('Liquefaction','Sand at the surface, cracks, sunken ground — especially in the eastern suburbs, where soils were wet and sandy.')+fc('≈ 15,000','homes damaged by ground movement. Often the buildings were not seriously damaged by the shaking itself.')+fc('Not magnitude','The 2010 Darfield earthquake had a higher magnitude, yet Christchurch hurt the city far more: closer to the centre and shallower.')+'</div>'},
{n:'Buildings',h:()=>'<p class="k">Evidence · structures</p><h2>Not all buildings fail equally</h2><div class="g c2"><div class="card"><p class="k">Christchurch inspections</p>'+[['Unreinforced brick',650],['Unreinforced stone',90],['Concrete block',342]].map(x=>'<div class="row" style="grid-template-columns:12rem 1fr 4rem"><span>'+x[0]+'</span><span class="bt"><i class="bf" style="width:'+x[1]/6.5+'%"></i></span><b>'+x[1]+'</b></div>').join('')+'<small>Approximate number of buildings inspected.</small><p>Modern concrete-frame buildings generally performed better; older unreinforced brick suffered much more damage.</p></div><div class="card"><p class="k">Why</p><p>Old brick without steel: walls can separate from floors or roofs.</p><p>Modern design: absorbs and distributes seismic forces.</p><div class="ask">Yet two modern concrete office buildings also collapsed. Modern does not mean completely safe.</div></div></div>'},
{n:'Challenge',h:()=>'<div id="ch">'+chl()+'</div>',a:()=>{cs={i:0,p:-1,r:0};$('#ch').innerHTML=chl()}},

{n:'Reflection',h:()=>'<p class="k">Reflection</p><h2>What is one thing you learned today that you did not know before?</h2><p class="lead">Students answer aloud. The presenter taps the concept mentioned, or types a short answer.</p>'+rf()},
{n:'Conclusion',h:()=>'<p class="k">Conclusion</p><h2>Magnitude is only the start of the story</h2><div class="g c3"><div class="card"><p class="k">Hypothesis supported</p><p>In both earthquakes, weak ground and poorly reinforced buildings suffered more, even where the earthquake was the same.</p></div><div class="card"><p class="k">No single factor</p><p>Distance, depth, local geology and construction quality work together. Soft soil is not always severe, and liquefaction needs specific soil and water conditions.</p></div><div class="card"><p class="k">Why it matters</p><p>Laudato Si’ links housing to human dignity, asks residents to take part in decisions, and calls for special concern for the poorest — including families who cannot afford safer homes or repairs.</p></div></div><div class="ask">We cannot stop earthquakes, but planning and access to protection can reduce suffering.</div><p><small>Sources (need internet): '+SRC.map(s=>'<a style="color:var(--c)" target="_blank" rel="noopener" href="'+s[1]+'">'+s[0]+'</a>').join(' · ')+'</small></p>'},
