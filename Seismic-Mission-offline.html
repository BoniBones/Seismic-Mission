<script>
/* Pure state, validation and reporting logic. No DOM, storage or network access. */

  const localDate = (d = new Date()) => [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  const validDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(Date.parse(v)) && new Date(v).toISOString().slice(0,10) === v;

  const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10));
  const emptyPoll = p => ({counts:p.options.map(()=>0),status:'not_started',revealed:false,reason:''});
  function create() {
    return {version:VERSION,session:{id:uid(),date:localDate(),label:'',size:null,createdAt:new Date().toISOString()},
      ui:{slide:0,feedback:0,check:0,case:'loma',labAxis:'ground',ground:'soft',structure:'weak',labRevealed:false,liquidStep:0,motion:true,guide:false},
      polls:Object.fromEntries(C.polls.map(p=>[p.id,emptyPoll(p)])),
      council:{selected:[],reason:'',risk:'',equity:'',residents:false,before:[]},
      reflections:[],reflectionDraft:{text:'',kind:'learning',peerStrength:'',peerNext:'',criteria:[false,false,false]},
      teacher:{scores:Object.fromEntries(C.faculty.map(c=>[c.id,null])),overall:null,strengths:'',improvements:'',comments:'',name:'',date:localDate(),status:'draft',reviewedAt:'',confirmedAt:''},timer:60};
  }
  function normalize(input) {
    const a = obj(input), d = create(), s = obj(a.session), u = obj(a.ui);
    d.session = {id:text(s.id,80)||d.session.id,date:validDate(s.date)?s.date:d.session.date,label:text(s.label,80),size:s.size === null || s.size === '' || s.size === undefined ? null : int(s.size,1),createdAt:iso(s.createdAt)||d.session.createdAt};
    d.ui = {slide:int(u.slide,0,C.chapters.length-1),feedback:int(u.feedback,0,6),check:int(u.check,0,1),case:u.case==='christchurch'?'christchurch':'loma',labAxis:u.labAxis==='structure'?'structure':'ground',ground:['rock','soft','wet'].includes(u.ground)?u.ground:'soft',structure:u.structure==='designed'?'designed':'weak',labRevealed:u.labRevealed===true,liquidStep:int(u.liquidStep,0,2),motion:u.motion!==false,guide:u.guide===true};
    C.polls.forEach(p=>{
      const v=obj(obj(a.polls)[p.id]), supplied=Array.isArray(v.counts)?v.counts:[];
      const counts=p.options.map((_,i)=>int(supplied[i]));
      const bad=supplied.length!==p.options.length || supplied.some(x=>typeof x!=='number'||!Number.isInteger(x)||x<0||x>500);
      let status=['draft','completed','skipped'].includes(v.status)?v.status:'not_started';
      if(status==='completed' && (bad || !sum(counts) || (d.session.size && sum(counts)>d.session.size)))status='draft';
      d.polls[p.id]={counts,status,revealed:v.revealed===true,reason:text(v.reason,600)};
    });
    const c=obj(a.council);let spent=0;
    const allowed=Array.isArray(c.selected)?c.selected:[];
    d.council={selected:C.budget.filter(x=>allowed.includes(x.id)&&spent+x.cost<=10&&(spent+=x.cost)).map(x=>x.id),reason:text(c.reason),risk:text(c.risk),equity:text(c.equity),residents:c.residents===true,before:C.budget.filter(x=>Array.isArray(c.before)&&c.before.includes(x.id)).map(x=>x.id)};
    const cleanReflection = v => {const x=obj(v);return {id:text(x.id,80)||uid(),text:text(x.text,700),kind:x.kind==='application'?'application':'learning',peerStrength:text(x.peerStrength,400),peerNext:text(x.peerNext,400),criteria:[0,1,2].map(i=>Array.isArray(x.criteria)&&x.criteria[i]===true)}};
    d.reflections=(Array.isArray(a.reflections)?a.reflections:[]).slice(0,6).map(cleanReflection).filter(x=>x.text.trim());
    d.reflectionDraft=cleanReflection(a.reflectionDraft);
    const t=obj(a.teacher), scores=obj(t.scores);
    const rate=v=>v==='na'?'na':Number.isInteger(v)&&v>=1&&v<=4?v:null;
    d.teacher={scores:Object.fromEntries(C.faculty.map(c=>[c.id,rate(scores[c.id])])),overall:rate(t.overall),strengths:text(t.strengths),improvements:text(t.improvements),comments:text(t.comments),name:text(t.name,80),date:validDate(t.date)?t.date:d.session.date,status:'draft',reviewedAt:iso(t.reviewedAt),confirmedAt:iso(t.confirmedAt)};
    if(t.status==='confirmed' && C.faculty.every(c=>d.teacher.scores[c.id]!==null) && d.teacher.confirmedAt && d.teacher.reviewedAt)d.teacher.status='confirmed';
    d.timer=int(a.timer,0,600);
    return d;
  }
  function parse(raw) {
    if(raw===null||raw===undefined||raw==='')return {state:create(),warning:'',raw:null,blocked:false};
    try {const a=JSON.parse(raw);if(a?.version!==VERSION||!a.session||!a.polls)throw Error('schema');
      const state=normalize(a);
      const repaired=C.polls.some(p=>JSON.stringify(state.polls[p.id])!==JSON.stringify(a.polls[p.id])) || (a.teacher?.status==='confirmed'&&state.teacher.status!=='confirmed');
      return {state,warning:repaired?'Some saved values were invalid and have been repaired. Review tallies before using the report.':'',raw:null,blocked:false};
    } catch {return {state:create(),warning:'Saved data could not be read. It has not been overwritten. Open Session & data to recover a backup or start again.',raw,blocked:true}};
  }
  function pollStats(state,id) {
    const p=C.polls.find(x=>x.id===id),v=state.polls[id],n=sum(v.counts),invalid=!!state.session.size&&n>state.session.size;
    const completed=v.status==='completed' && n>0 && !invalid;
    const rated=p.kind==='rubric'?sum(v.counts.slice(0,4)):null;
    return {n,completed,invalid,rated,missing:state.session.size===null?null:Math.max(0,state.session.size-n),correct:completed&&p.kind==='knowledge'?v.counts[p.answer]:null,percent:completed&&p.kind==='knowledge'?Math.round(v.counts[p.answer]/n*100):null};
  }
  function setVote(state,id,index,value) {
    const p=C.polls.find(x=>x.id===id);if(!p||!Number.isInteger(index)||index<0||index>=p.options.length)return 'Unknown voting option.';
    const v=state.polls[id],next=int(value),n=sum(v.counts)-v.counts[index]+next;

  }
  function completePoll(state,id) {
    const st=pollStats(state,id);if(!st.n)return 'Record at least one response, or skip this question.';
    if(st.invalid)return 'The tally exceeds the class size. Correct it before completing.';
    state.polls[id].status='completed';return '';
  }
  function toggleBudget(state,id) {
    const option=C.budget.find(x=>x.id===id);if(!option)return 'Unknown option.';
    const selected=state.council.selected;
    if(selected.includes(id)){state.council.selected=selected.filter(x=>x!==id);return ''}
    if(budgetTotal(state)+option.cost>10)return 'This plan exceeds 10 credits. Remove an option before adding this one.';
    selected.push(id);return '';
  }
  const budgetTotal = s => C.budget.filter(x=>s.council.selected.includes(x.id)).reduce((n,x)=>n+x.cost,0);
  const risks = s => [
    !s.council.selected.includes('school')&&'The school remains structurally unstrengthened.',
    !s.council.selected.includes('homes')&&'Housing structural vulnerabilities remain.',
    !s.council.selected.includes('ground')&&'Housing ground and foundation risks remain.',
    !s.council.selected.includes('prepare')&&'Community preparedness is not funded.',
    'No plan guarantees complete safety.'
  ].filter(Boolean);
  function editTeacher(state){state.teacher.status='draft';state.teacher.reviewedAt='';state.teacher.confirmedAt=''}
  function reviewTeacher(state){if(C.faculty.some(c=>state.teacher.scores[c.id]===null))return 'Score each criterion or select Not observed before reviewing.';state.teacher.reviewedAt=new Date().toISOString();return ''}
  function confirmTeacher(state){if(!state.teacher.reviewedAt||C.faculty.some(c=>state.teacher.scores[c.id]===null))return 'Review the completed rubric before confirming.';state.teacher.status='confirmed';state.teacher.confirmedAt=new Date().toISOString();return ''}
  function evidence(s) {
    return {format:'seismic-mission-evidence',version:VERSION,title:C.title,researchQuestion:C.question,exportedAt:new Date().toISOString(),session:{...s.session},
      method:'Non-anonymous hand-raising entered by the presenter. One response per student per question; no individual tracking. Incomplete tallies are not evidence of a whole-class result.',
      polls:C.polls.map(p=>{const st=pollStats(s,p.id);return {id:p.id,type:p.kind,question:p.title,options:p.options,counts:[...s.polls[p.id].counts],status:s.polls[p.id].status,responses:st.n,unrecorded:st.missing,eligibleForSummary:st.completed,answerRevealed:s.polls[p.id].revealed,reason:s.polls[p.id].reason,correctOption:p.kind==='knowledge'?p.options[p.answer]:null,correctResponses:st.correct,correctPercentOfRecordedHands:st.percent}}),
      reflections:s.reflections.map(x=>({...x,observation:x.kind==='application'?'Presenter-coded features of this spoken sample, not an individual grade':'Self-reported learning; not independently verified'})),
      council:{...s.council,fictitiousBudget:true,spent:budgetTotal(s),remainingRisks:risks(s)},
      faculty:{...s.teacher,criteria:C.faculty.map(c=>({criterion:c.title,score:s.teacher.scores[c.id],descriptor:typeof s.teacher.scores[c.id]==='number'?c.levels[s.teacher.scores[c.id]-1]:s.teacher.scores[c.id]==='na'?'Not observed':'Not rated'}))},
      interpretation:'Confidence and reflection ratings describe perceptions. Knowledge tallies show responses to specific questions. Counts across questions are repeated responses, not unique students. No learning-gain or whole-class mastery claim is calculated.'};
  }
  const csvCell = v => {let s=String(v??'');if(/^[\s\uFEFF]*[=+\-@]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  function csv(state) {
    const e=evidence(state),rows=[['section','item','option_or_descriptor','value','status','recorded_n','class_size']];
    rows.push(['session','title','',e.title,'','',''],['session','date','',e.session.date,'','',''],['session','label','',e.session.label,'','',''],['session','class_size','',e.session.size??'not entered','','','']);
    e.polls.forEach(p=>{p.options.forEach((o,i)=>rows.push([p.type,p.question,o,p.counts[i],p.status,p.responses,e.session.size??'']));if(p.correctResponses!==null)rows.push(['knowledge_result',p.question,'correct / recorded hands',p.correctResponses+' / '+p.responses,p.status,p.responses,e.session.size??'']);if(p.reason)rows.push(['class_reason',p.question,'',p.reason,p.status,p.responses,e.session.size??''])});
    e.reflections.forEach((r,i)=>{rows.push(['reflection '+(i+1),r.kind,'spoken response',r.text,'recorded','',''],['peer_feedback',String(i+1),'scientific strength',r.peerStrength,'recorded','',''],['peer_feedback',String(i+1),'suggested improvement',r.peerNext,'recorded','','']);if(r.kind==='application')r.criteria.forEach((v,j)=>rows.push(['observed_application',String(i+1),['ground mechanism','structural factor','uncertainty / limit'][j],v?'observed':'not recorded','presenter-coded','','']))});

})();

<script>

  function hero(){return `<svg class="hero-diagram" viewBox="0 0 760 650" role="img" aria-label="Two neighbourhoods above different ground layers, with a common earthquake source"><title>One earthquake. Different local conditions.</title><desc>Illustrative cross-section with a firm-rock site and a saturated-soil site. The drawing does not predict damage.</desc><defs><pattern id="hero-grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#24333a" stroke-width=".7"/></pattern></defs><rect x="0" y="0" width="760" height="650" fill="url(#hero-grid)"/><g fill="none" stroke="#80aa96" opacity=".22"><ellipse cx="383" cy="460" rx="90" ry="58"/><ellipse cx="383" cy="460" rx="165" ry="110"/><ellipse cx="383" cy="460" rx="245" ry="166"/><ellipse cx="383" cy="460" rx="321" ry="224"/></g><path d="M60 315L377 235 702 315 386 409Z" fill="#526951" stroke="#a6be9a"/><path d="M60 315L386 409V550L60 454Z" fill="#2d4943" stroke="#8ca994"/><path d="M386 409L702 315V454L386 550Z" fill="#395a62" stroke="#8eb9ba"/><path d="M60 356L386 450M60 397L386 491M60 436L386 530" stroke="#6b8972" stroke-width="2"/><path d="M386 450L702 357M386 491L702 398M386 530L702 437" stroke="#76beca" stroke-dasharray="4 6" stroke-width="2"/><g transform="translate(105 327) skewY(16) scale(.88)">${building(0,0,true)}</g><g transform="translate(247 367) skewY(16) scale(.7)">${building(0,0,true)}</g><g transform="translate(470 356) skewY(-16) scale(.9)">${building(0,0,false)}</g><g transform="translate(603 317) skewY(-16) scale(.66)">${building(0,0,false)}</g><path d="M185 190V122H56M574 195V82H704" stroke="#c0d5c7" fill="none"/><circle cx="185" cy="190" r="5" fill="#d3fa86"/><circle cx="574" cy="195" r="5" fill="#efb777"/><text x="56" y="102" fill="#d3fa86" font-size="19" font-family="monospace">A / FIRM ROCK</text><text x="445" y="60" fill="#efb777" font-size="19" font-family="monospace">B / SATURATED SOIL</text><circle cx="383" cy="460" r="9" fill="#d3fa86"/><path d="M383 465L288 584H57" fill="none" stroke="#d3fa86"/><text x="57" y="612" fill="#d3fa86" font-size="17" font-family="monospace">ONE EARTHQUAKE SOURCE</text></svg>`}
  function pathway(){return `<svg class="pathway" viewBox="0 0 1100 300" role="img" aria-label="Earthquake source, wave path, local ground and structure together influence damage"><title>From source to structure</title><path d="M20 225H1080" stroke="#78938c" stroke-width="3"/><path d="M20 225H530V285H20Z" fill="#304b43"/><path d="M530 225H1080V285H530Z" fill="#5e6650"/><path d="M42 285L147 174" stroke="#eebd7c" stroke-width="4"/><circle cx="99" cy="226" r="11" fill="#eebd7c"/><g fill="none" stroke="#eebd7c" opacity=".5"><circle cx="99" cy="226" r="49"/><circle cx="99" cy="226" r="90"/><circle cx="99" cy="226" r="135"/></g><path d="M260 176H420M410 166l12 10-12 10M500 176H660M650 166l12 10-12 10" stroke="#c9e29f" stroke-width="2" fill="none"/>${building(810,220,true)}<text x="34" y="45" fill="#eebd7c" font-size="23" font-family="system-ui">01 / Source</text><text x="300" y="45" fill="#d5e6de" font-size="23" font-family="system-ui">02 / Path</text><text x="565" y="45" fill="#d5e6de" font-size="23" font-family="system-ui">03 / Ground</text><text x="825" y="45" fill="#d3fa86" font-size="23" font-family="system-ui">04 / Structure</text></svg>`}
  function grains(step) {
    const circles=Array.from({length:30},(_,i)=>{const col=i%6,row=Math.floor(i/6),x=65+col*68+(row%2)*15,y=75+row*48;return `<circle cx="${x}" cy="${y}" r="25" fill="#cbb58f" stroke="#eed8b1" stroke-width="2"/>`}).join('');
    return `<svg class="grain-diagram" viewBox="0 0 500 360" role="img" aria-label="${['Grains in contact with water between them','Shaking raises water pressure between grains, reducing effective contact forces','Ground may lose strength and settle or move sideways'][step]}"><title>Liquefaction mechanism, step ${step+1}</title><rect x="20" y="40" width="460" height="280" rx="8" fill="${step?'#305d70':'#284650'}"/>${circles}<path d="M20 40H480" stroke="#87c8dd" stroke-width="3"/>${step?'<g stroke="#91e0ed" stroke-width="3" fill="none"><path d="M99 83v-16m-5 7 5-7 5 7M235 179v-16m-5 7 5-7 5 7M386 131v-16m-5 7 5-7 5 7"/></g>':''}<text x="24" y="345" fill="#b7d1d4" font-size="16" font-family="system-ui">Grains + pore water · mechanism only, not to scale</text></svg>`;

<script>
window.RESEARCH_TEXT = "# Why Do Earthquakes Damage Some Places More Than Others?\n\n**Abstract**\n\nThe magnitude of an earthquake tells us how much energy is released, but it does not explain why some places suffer more damage than others. This research focuses on how different soil conditions and building structures can influence the damage caused by earthquakes. To investigate this, I analyzed information from two important earthquakes: Loma Prieta in 1989 and Christchurch in 2011. The results show that areas with soft or water-saturated soils can experience stronger shaking and liquefaction, which can seriously damage building foundations. Also, older buildings without proper reinforcement are generally more vulnerable than modern buildings designed to resist earthquakes. These findings suggest that earthquake damage depends not only on magnitude, but also on local ground conditions and the quality of buildings.\n\n**Introduction**\n\nWhen we hear about an earthquake, one of the first things we usually want to know is its magnitude. However, magnitude does not tell us everything about the damage it can cause. Sometimes, an earthquake can destroy an entire neighborhood while another area nearby suffers almost no damage.\n\nThis research investigates why this happens, focusing mainly on two factors: the type of ground where buildings are located and how those buildings are constructed. Understanding these differences is important because it can help us prevent damage in the future by improving building designs, choosing safer places for construction and using stronger foundations. The main hypothesis of this research is that earthquakes cause more damage in areas with weak soil conditions or poorly constructed buildings, even when other places experience the same earthquake. \n\nTo investigate this idea, we will focus on two predictions. First, areas with soft or wet soils should experience stronger shaking or more ground movement. Second, older or weaker buildings should suffer more damage than modern buildings in similar conditions. To test these predictions, I will use information and observations from two real earthquakes: the 1989 Loma Prieta earthquake in California and the 2011 Christchurch earthquake in New Zealand.\n\n# Theoretical Background\n\nBefore analyzing the earthquakes, it is important to understand the difference between magnitude and intensity. Magnitude measures the total energy released by an earthquake, so each earthquake has only one magnitude value. On the other hand, intensity describes how strongly the earthquake is felt in a particular location and the damage it produces there. This means that the same earthquake can have different intensity values depending on the area. Some important factors are the distance from the fault, the depth of the earthquake and the type of soil found in each location.\n\nSoil conditions can have a major influence on the damage caused by earthquakes. When seismic waves travel through soft soils, they can produce stronger shaking than when they travel through solid rock. Another important problem is liquefaction, which happens when loose, sandy soil containing a lot of water temporarily loses its strength during an earthquake and starts behaving almost like a liquid.When liquefaction occurs, the ground can sink, crack or move sideways. This can damage the foundations of buildings, roads and underground pipes, even when the structures above them are relatively strong.\n\nAnother important factor is the quality of the buildings themselves. Different structures react differently to earthquakes depending on their materials, height, weight and design. For example, old brick buildings without steel reinforcement are usually more vulnerable because their walls can separate from the floors or roofs during strong shaking. Modern buildings, especially those designed to resist earthquakes, usually perform better because they can absorb and distribute seismic forces more effectively. However, this does not mean that every modern building is completely safe. In general, earthquake damage depends on the combination of natural conditions and how vulnerable the buildings and infrastructure are.\n\n# Research\n\nFor this research, we used scientific reports and studies about two earthquakes that caused important damage in urban areas. These are the 1989 Loma Prieta earthquake in the United States and the 2011 Christchurch earthquake in New Zealand. The information comes mainly from reports published by the United States Geological Survey (USGS) and engineering studies carried out after the earthquakes.We compared three main aspects: the behavior of the soil, the damage suffered by different types of buildings, and other factors that could explain the results, such as the distance from the fault.\n\n## Loma Prieta in 1989\n\nOn October 17, 1989, a magnitude 6.9 earthquake struck California. Although a lot of damage occurred near the epicenter, some areas of Oakland and San Francisco, which were farther away, also experienced serious destruction. \n\nAccording to USGS investigations, soft soils increased the strength of shaking in some areas, sometimes making it about twice as strong. Researchers also found that wet sandy soils and artificial landfills around San Francisco Bay experienced liquefaction. One of the most affected locations was the Marina District in San Francisco. In this area, the soft ground made the shaking stronger, while liquefaction caused problems with the soil supporting the buildings. This is a good example of why magnitude alone cannot explain earthquake damage. Even places that are not very close to the epicenter can suffer serious destruction if the ground conditions are unfavorable. \n\nThe buildings themselves also played an important role. USGS reports showed that modern buildings designed to resist earthquakes generally performed better than older brick buildings without reinforcement. Another important example was the Cypress Street Viaduct in Oakland, which suffered a major collapse. Its structural weaknesses, together with the ground conditions, contributed to the severity of the damage.\n\nThese observations show that both soil conditions and construction quality are important when trying to understand why some areas are more affected than others.\n\n## Christchurch in 2011\n\nThe Christchurch earthquake of February 22, 2011, in New Zealand is another example of how damage can vary between different areas of the same city. After the earthquake, researchers found many signs of liquefaction, including sand coming up to the surface, cracks in the ground and areas where the soil had sunk.\n\nThe eastern suburbs of Christchurch were especially affected because they had wet, sandy soils that reacted badly to the strong shaking. According to engineering reports, ground movement damaged around 15,000 homes. In many cases, the buildings themselves had not been seriously damaged by the shaking, but the movement of the ground underneath them caused major problems.This shows that earthquakes do not always damage buildings directly. Sometimes, the biggest problem is that the ground supporting them becomes unstable.\n\nResearchers also inspected different types of buildings, including approximately 650 unreinforced brick buildings, 90 stone buildings without reinforcement and 342 concrete block buildings. Their observations showed that modern concrete-frame buildings generally performed better, while older unreinforced brick buildings suffered much more damage. However, two modern concrete office buildings also collapsed, showing that modern construction does not guarantee complete safety. \n\nAnother interesting point is the comparison with the 2010 Darfield earthquake. Even though the Darfield earthquake had a higher magnitude, the Christchurch earthquake caused much more severe damage in the city. One of the main reasons was that the 2011 earthquake occurred closer to the city center and at a shallower depth. This produced extremely strong shaking in urban areas.\n\nConsequently, the Christchurch earthquake shows that magnitude is not the only important factor. The location and depth of the earthquake, together with soil conditions and the quality of buildings, can have a major influence on the damage.\n\n# Discussion\n\nAfter analyzing both earthquakes, we found evidence supporting the two predictions presented in the introduction. In Loma Prieta, scientists observed that areas with soft soils experienced stronger shaking and liquefaction. They also found important differences between the performance of modern buildings and older brick structures.\n\nSomething similar happened in Christchurch, where researchers recorded severe ground movement in areas with wet, sandy soils. The building inspections also showed that structures without proper reinforcement were generally more vulnerable. These results suggest that local geological conditions and building quality play a very important role in determining how much damage an earthquake causes.\n\nHowever, there are other factors that must also be considered. For example, the distance from the fault and the strength of the shaking are clearly important. A building located very close to the fault can experience extreme shaking even if it is built on solid ground. Nevertheless, these factors do not explain every difference in damage. Soil liquefaction and structural weaknesses can make the situation much worse, even in areas located farther away.\n\nIt is also important to understand that soft soils do not always cause severe destruction and that modern buildings are not completely protected from earthquakes. Liquefaction, for example, only happens under certain soil and water conditions. Overall, the evidence shows that earthquake damage is the result of several factors working together, rather than just the magnitude of the event.\n\n# Conclusion\n\nIn conclusion, the research supports the hypothesis that earthquakes affect some places more seriously than others because of differences in soil conditions and building quality. The examples of Loma Prieta in 1989 and Christchurch in 2011 show that the magnitude of an earthquake does not determine how much damage every area will experience.\n\nOne of the most important factors is the type of ground. Soft soils can increase the strength of seismic shaking, while water-saturated sandy soils can experience liquefaction. This can make the ground unstable and cause serious problems for buildings, even in places that are not very close to the epicenter. Another important factor is how buildings are constructed. Older structures without proper reinforcement are generally more vulnerable to strong shaking, while modern buildings designed to resist earthquakes usually perform better.\n\nHowever, the research also shows that no single factor can completely explain earthquake damage. Distance from the fault, earthquake depth, local geology and construction quality all influence the final results.\n\nTherefore, we can conclude that the hypothesis is supported by the evidence from both earthquakes. Understanding these differences is important because it can help us design safer buildings, improve urban planning and reduce the damage caused by future earthquakes.\n\nThese findings also connect with Pope Francis’s message in Laudato Si’. He links housing to human dignity and calls for residents to take part in decisions about their neighbourhoods (Francis, 2015, paras. 150–152). Applied to earthquake risk, this means using scientific knowledge to plan safer communities and improve vulnerable buildings.\n\nFrancis also argues that the common good requires special concern for the poorest (2015, para. 158). In earthquake preparation, this means helping families who cannot afford safer homes or repairs. Although we cannot stop tectonic earthquakes, responsible planning and fair access to protection can reduce suffering and show care for our common home.\n\n**Bibliography**\n\n(2026, October 13). Earthquake loma prieta California 1989, Nisit.gov. \n\n[https://www.nist.gov/el/earthquake-loma-prieta-california-1989](https://www.nist.gov/el/earthquake-loma-prieta-california-1989) \n\n(2026, October 13). Christchurch earthquake, New Zealand 2011, knowledge.aidr.org.au \n\n[https://knowledge.aidr.org.au/resources/earthquake-christchurch-new-zealand-2011/](https://knowledge.aidr.org.au/resources/earthquake-christchurch-new-zealand-2011/) \n\n(2026, October 13). Christchurch earthquake kills 185, nzhistory.govt.nz \n\n[https://www.usgs.gov/faqs/why-do-earthquakes-other-countries-seem-cause-more-damage-and-casualties-earthquakes-us](https://www.usgs.gov/faqs/why-do-earthquakes-other-countries-seem-cause-more-damage-and-casualties-earthquakes-us) \n\n(2026, October 13). What is the difference between earthquake magnitude and earthquake intensity? What is the Modified Mercalli intensity scale? usgs.gov \n\n[https://www.usgs.gov/faqs/what-difference-between-earthquake-magnitude-and-earthquake-intensity-what-modified-mercalli](https://www.usgs.gov/faqs/what-difference-between-earthquake-magnitude-and-earthquake-intensity-what-modified-mercalli) \n\n(2026, October 13). M 6.9 October 17, 1989 Loma prieta earthquake, usgs.gov \n\n[https://www.usgs.gov/programs/earthquake-hazards/science/m-69-october-17-1989-loma-prieta-earthquake](https://www.usgs.gov/programs/earthquake-hazards/science/m-69-october-17-1989-loma-prieta-earthquake) \n\nFrancis. (2015, May 24). *Laudato si’*. Vatican. https://www.vatican.va/content/francesco/en/encyclicals/documents/papa-francesco_20150524_enciclica-laudato-si.html\n\n";

'use strict';
SM.report = (() => {
  const K=SM.core,C=SM.content,e=K.esc;
  const css=`.report{font:14px/1.55 Arial,sans-serif;color:#182a33;background:#fff;padding:32px;max-width:1050px;margin:auto}.report *{box-sizing:border-box}.report h1{font-size:33px;letter-spacing:-1px;line-height:1.15;margin:0 0 8px;color:#162b2b}.report h2{font-size:23px;line-height:1.2;border-top:2px solid #284b42;padding-top:18px;margin:28px 0 12px;letter-spacing:-.4px;color:#162b2b}.report h3{font-size:17px;line-height:1.3;margin:18px 0 8px}.report p{margin:8px 0}.report .report-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#3d6352}.report .report-meta{background:#edf2ec;padding:14px 18px;margin:18px 0}.report table{border-collapse:collapse;width:100%;font-size:12px;margin:10px 0}.report th,.report td{border:1px solid #bdccc7;text-align:left;padding:8px;vertical-align:top;color:#182a33}.report th{background:#edf2ec}.report .report-note{color:#495c65;font-size:12px}.report .report-warning{border-left:3px solid #9b6636;padding:8px 12px;background:#faf3e9}.report blockquote{margin:8px 0;padding:8px 14px;border-left:3px solid #7c9d82;white-space:pre-wrap}.report .text-value{white-space:pre-wrap;overflow-wrap:anywhere}.report .report-footer{font-size:11px;border-top:1px solid #9cafaa;padding-top:12px;margin-top:30px}.report .report-block{break-inside:avoid}.report a{color:#244c5f}.report .mini-bar{height:7px;background:#e3ebe6;width:130px;max-width:100%;margin-top:5px}.report .mini-bar span{display:block;height:100%;background:#476d57} @media print{body{margin:0;background:#fff}.report{padding:0;max-width:none}h2,h3{break-after:avoid}tr,.report-block{break-inside:avoid}@page{size:A4;margin:16mm}}`;
  const value=v=>v?`<span class="text-value">${e(v)}</span>`:'<span class="report-note">Not recorded.</span>';
  function html(s){
    const x=K.evidence(s),teacher=x.faculty;
    const pollBlock=p=>`<div class="report-block"><h3>${e(p.question)}</h3><p class="report-note">${e(p.type)} · Status: ${e(p.status)} · n=${p.responses}${x.session.size!==null?` of ${x.session.size} students · ${p.unrecorded} unrecorded`: ' · class size not entered'}. ${p.eligibleForSummary?'Completed tally.':'Not included in completed summary metrics.'}${p.answerRevealed?' Explanation has been revealed.':''}</p>${p.responses?`<table><thead><tr><th>Response</th><th>Recorded hands</th></tr></thead><tbody>${p.options.map((o,i)=>`<tr><td>${e(o)}</td><td>${p.counts[i]}<div class="mini-bar"><span style="width:${p.counts[i]/p.responses*100}%"></span></div></td></tr>`).join('')}</tbody></table>`:'<p class="report-note">No responses recorded.</p>'}${p.correctResponses!==null?`<p><b>Supported answer:</b> ${e(p.correctOption)}<br>${p.correctResponses} / ${p.responses} recorded hands (${p.correctPercentOfRecordedHands}%). Denominator includes “not sure / pass”.</p>`:''}${p.reason?`<p><b>Class explanation:</b> ${value(p.reason)}</p>`:''}</div>`;
    return `<article class="report"><p class="report-label">Classroom evidence / Seismic Mission 3.0</p><h1>Why Do Earthquakes Damage<br>Some Places More Than Others?</h1><p>Student participation, peer reflection and faculty evaluation</p><div class="report-meta"><b>Session date:</b> ${e(x.session.date)} &nbsp; <b>Class:</b> ${e(x.session.label||'Not entered')}<br><b>Class size:</b> ${x.session.size??'Not entered'} &nbsp; <b>Report generated:</b> ${e(x.exportedAt)}<br><b>Session ID:</b> ${e(x.session.id)}</div><p class="report-note">${e(x.method)}</p><p class="report-warning">${e(x.interpretation)}</p>
    <h2>1. Demonstrated knowledge and initial prediction</h2>${x.polls.filter(p=>['prediction','knowledge'].includes(p.type)).map(pollBlock).join('')}
    <h2>2. Student reflection rubric and concept feedback</h2><p class="report-note">The five 1–4 rubric dimensions describe reported understanding and experience, not assessed mastery. “Pass / not rated” is not a fifth rubric level. No pooled mean is calculated.</p>${x.polls.filter(p=>!['prediction','knowledge'].includes(p.type)).map(pollBlock).join('')}
    <h2>3. Spoken reflections and peer feedback</h2><p class="report-note">${x.reflections.length} qualitative samples recorded. Samples may come from the same student; they are not a class coverage count.</p>${x.reflections.length?x.reflections.map((r,i)=>`<div class="report-block"><h3>Sample ${i+1} · ${e(r.kind)}</h3><blockquote>${e(r.text)}</blockquote><p><b>Peer identified strength:</b> ${value(r.peerStrength)}</p><p><b>Peer suggested improvement:</b> ${value(r.peerNext)}</p>${r.kind==='application'?`<p><b>Presenter heard:</b> ${['Correct ground mechanism','Relevant structural factor','Limit or uncertainty'].map((label,j)=>`${label}: ${r.criteria[j]?'observed':'not recorded'}`).join('; ')}.</p>`:''}<p class="report-note">${e(r.observation)}</p></div>`).join(''):'<p>No reflections recorded.</p>'}
    <h2>4. Town council application</h2><p class="report-note">Fictional town and costs. The plan is an argument under constraints, not an engineering design or a prediction of lives saved.</p><p><b>Selected actions:</b> ${e(C.budget.filter(b=>s.council.selected.includes(b.id)).map(b=>b.title).join('; ')||'None recorded')}<br><b>Budget:</b> ${x.council.spent} / 10 fictional credits.</p><p><b>Scientific reason:</b> ${value(x.council.reason)}</p><p><b>Risk identified by the class:</b> ${value(x.council.risk)}</p><p><b>Who benefits and why:</b> ${value(x.council.equity)}</p><p><b>Residents’ context:</b> ${x.council.residents?'revealed':'not revealed'}</p>${x.council.residents?`<p><b>Plan before residents’ context:</b> ${e(C.budget.filter(b=>s.council.before.includes(b.id)).map(b=>b.title).join('; ')||'No plan recorded')}</p>`:''}<p><b>Remaining risks identified by the activity:</b></p><ul>${x.council.remainingRisks.map(r=>`<li>${e(r)}</li>`).join('')}</ul>
    <h2>5. Faculty evaluation — ${e(teacher.status).toUpperCase()}</h2><p><b>Evaluation date:</b> ${e(teacher.date)}<br><b>Teacher name (voluntary):</b> ${e(teacher.name||'Not provided')}</p>${teacher.status!=='confirmed'?'<p class="report-warning">This evaluation has not been confirmed. Any scores or comments below are a draft.</p>':`<p class="report-note">Confirmed after review at ${e(teacher.confirmedAt)}. This records operator confirmation, not a verified signature or identity.</p>`}<table><thead><tr><th>Criterion</th><th>Score</th><th>Criterion-specific descriptor</th></tr></thead><tbody>${teacher.criteria.map(c=>`<tr><td>${e(c.criterion)}</td><td>${typeof c.score==='number'?c.score+' / 4':c.score==='na'?'Not observed':'Not rated'}</td><td>${e(c.descriptor)}</td></tr>`).join('')}</tbody></table><p class="report-note">${teacher.criteria.filter(c=>typeof c.score==='number').length} / 7 criteria scored; ${teacher.criteria.filter(c=>c.score==='na').length} not observed. No overall average is inferred.</p><p><b>Overall evaluation (optional):</b> ${teacher.overall===null?'Not provided':teacher.overall==='na'?'Not observed':teacher.overall+' / 4'}</p><p><b>Main strengths:</b> ${value(teacher.strengths)}</p><p><b>Suggested improvements:</b> ${value(teacher.improvements)}</p><p><b>Additional comments:</b> ${value(teacher.comments)}</p>
    <h2>6. Research provenance</h2><p class="report-note">Based on the preserved original project paper and its qualitative comparison of Loma Prieta (1989) and Christchurch (2011). Diagrams are conceptual; the town and credits are fictional. The research is documentary, not the presenter’s own fieldwork.</p><ul>${C.sources.filter(z=>z.url).map(z=>`<li>${e(z.title)} — <a href="${e(z.url)}">${e(z.url)}</a></li>`).join('')}</ul><p class="report-footer">Seismic Mission 3.0 · Browser-local records · No student accounts, automatic uploads, fabricated responses or signatures. This report contains only operator-entered data and clearly labelled activity descriptions.</p></article>`;
  }
  function document(s){return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seismic Mission — session evidence</title><style>'+css+'</style></head><body>'+html(s)+'</body></html>'}
  return {css,html,document};
})();
