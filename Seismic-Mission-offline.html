<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seismic Mission · Una ciudad, muchas decisiones</title><meta name="description" content="Una misión interactiva sobre terremotos, ciudades y cuidado de nuestra casa común."><style>:root{
  --bg:#0b151b;
  --panel:#13252d;
  --ink:#eef1e7;
  --muted:#a8bebf;
  --mint:#bbef91;
  --orange:#ffad72;
  --line:#30444c;
  --sr-green:#8ee89e;
  --sr-green-bg:#132b22;
  --sr-red:#ff8585;
  --sr-red-bg:#2b181d;
  --sr-trap:#ff9d76;
  --sr-trap-bg:#2b1d18;
  --sr-cyan:#9de3ec;
  --sr-cyan-bg:#142932;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 18px;border-radius:8px}
button:hover:not([disabled]){border-color:var(--mint);background:#20383d}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
[tabindex="-1"]:focus{outline:none}
button.primary{background:var(--mint);color:#142019;font-weight:700;border-color:var(--mint)}
button.primary:hover:not([disabled]){background:#ccf5aa;border-color:#ccf5aa}
button[disabled]{opacity:.4;cursor:not-allowed}
a{color:var(--mint)}
header{min-height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:15px 4vw;gap:15px}
header b{letter-spacing:3px;font-size:15px}
header b span{color:var(--mint)}
header>div{display:flex;gap:8px}
header button{padding:8px 12px;font-size:13px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 82px)}
nav{padding:35px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
nav button{text-align:left;border-color:transparent;font-size:14px;display:flex;gap:14px;align-items:center}
nav button.active{background:#213b3b;color:var(--mint)}
nav small{font-family:monospace;color:var(--muted)}
.navfoot{margin-top:auto;padding:30px 14px;font-size:12px;line-height:1.7;color:var(--muted)}
main{padding:34px clamp(22px,3.8vw,72px);max-width:1600px;width:100%;margin:auto}
.eyebrow{font:12px Consolas,monospace;letter-spacing:2px;color:var(--mint);text-transform:uppercase}
h1{font-size:clamp(42px,5.3vw,78px);font-weight:650;line-height:1.04;letter-spacing:-3px;max-width:900px;margin:22px 0}
h2{font-size:clamp(30px,3.3vw,46px);line-height:1.1;letter-spacing:-1.2px;margin:12px 0 18px}
h3{font-size:22px;margin:0 0 12px}
h4{font-size:16px;margin:0 0 10px}
p{line-height:1.65}
.lede{font-size:19px;max-width:820px;color:var(--muted);margin-top:0}
.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:35px;min-height:530px}
.hero h1 em{font-style:normal;color:var(--mint)}
.scene{width:100%;height:auto;overflow:visible}
.scene text{font-family:Segoe UI,Arial,sans-serif}
.small{font-size:13px;color:var(--muted);line-height:1.6}
.split{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin:32px 0}
.panel{padding:22px 24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.flat{border-top:1px solid var(--line);padding:25px 0}
.tag{font:12px Consolas,monospace;letter-spacing:1px;color:var(--orange)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-top:32px;gap:15px}
.footer span{font-size:13px;color:var(--muted)}
.big{font-size:72px;font-weight:700;letter-spacing:-4px;line-height:1}
.accent{color:var(--mint)}
.poll{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.poll button{min-height:120px;text-align:left;font-size:19px}
.poll button.chosen{border:2px solid var(--mint);background:#233e34}
.answer{background:#203b33;border-left:4px solid var(--mint);padding:20px;margin:22px 0;line-height:1.7}
.control{margin:22px 0}
.control label{display:block;margin-bottom:10px}
.control select{width:100%}
select{background:#0b1b23;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px}
.tabs{display:flex;gap:10px;margin:22px 0}
.tabs button.selected{background:var(--mint);color:var(--bg)}
.evidence{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.evidence article{border-top:2px solid var(--mint);padding-top:20px}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font-weight:600;font-size:18px}
details p{color:var(--muted)}
.quote{font-size:clamp(24px,2.8vw,38px);line-height:1.5;padding:16px 0;color:var(--mint)}
.teacher{border:1px dashed var(--orange);padding:18px 20px;border-radius:8px;margin:22px 0;color:#ffd4b5}
.teacher h3{font-size:17px}
.teacher p{margin-bottom:0}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--mint);color:#11231b;font-weight:600;border-radius:8px;padding:14px 24px;z-index:20;max-width:90vw}
.progress{height:3px;background:var(--line)}
.progress i{height:100%;display:block;background:var(--mint);transition:width .3s}
.modal{position:fixed;inset:0;background:#061118ed;z-index:10;overflow:auto;padding:5vw}
.modal>div{max-width:980px;margin:auto;background:var(--panel);padding:35px;border-radius:15px}
.modal pre{white-space:pre-wrap;font:16px/1.8 Segoe UI,Arial,sans-serif}
.hidden{display:none!important}
.shake{animation:shake .15s linear infinite}
.sunk{transform:translateY(18px) rotate(4deg);transform-origin:center}
.wave{stroke-dasharray:10 8;animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-108}}
@keyframes shake{0%,100%{translate:-3px 0}50%{translate:3px 0}}

/* --- Survival Run (Slides 5, 6, 7) --- */
.sr-consigna{border-left:4px solid var(--orange);margin-bottom:16px;padding:16px 22px}
.sr-directive{font-size:clamp(17px,1.45vw,21px);margin:0 0 12px;color:var(--ink);line-height:1.45}
.sr-directive strong{color:var(--orange)}
.sr-req-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sr-req-pill{font:13px Consolas,monospace;padding:6px 12px;border-radius:6px;background:#0d1c24;border:1px solid var(--line);color:var(--muted)}
.sr-counter{font:700 20px Consolas,monospace;padding:6px 14px;border-radius:8px;background:#0d1c24;border:1px solid var(--line);color:var(--ink)}
.sr-counter.is-complete{border-color:var(--mint);color:var(--mint);background:#1b3329}

.sr-timer{margin-bottom:18px;padding:16px 22px;transition:border-color .2s,background-color .2s}
.sr-timer-top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.sr-clock-wrap{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.sr-clock{font:700 clamp(34px,3.4vw,46px)/1 Consolas,monospace;color:var(--mint);letter-spacing:1px}
.sr-timer-status{font:600 14px Consolas,monospace;color:var(--muted)}
.sr-timer-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sr-timer-track{height:10px;background:#091319;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.sr-timer-fill{height:100%;background:var(--mint);transition:width .12s linear,background-color .2s}

.sr-timer.is-warning{border-color:var(--orange);background:#251d18}
.sr-timer.is-warning .sr-clock,.sr-timer.is-warning .sr-timer-status{color:var(--orange)}
.sr-timer.is-warning .sr-timer-fill{background:var(--orange)}
.sr-timer.is-expired{border-color:var(--sr-red);background:var(--sr-red-bg)}
.sr-timer.is-expired .sr-clock,.sr-timer.is-expired .sr-timer-status{color:var(--sr-red)}
.sr-timer.is-expired .sr-timer-fill{background:var(--sr-red)}
.sr-timer.is-locked{border-color:var(--sr-cyan)}
.sr-timer.is-locked .sr-timer-status{color:var(--sr-cyan)}

.sr-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sr-card{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  text-align:left;
  padding:18px 20px;
  background:var(--panel);
  border:2px solid var(--line);
  border-radius:12px;
  gap:10px;
  transition:border-color .15s,background-color .15s,opacity .15s;
}
.sr-card:nth-child(5){grid-column:1 / -1}
.sr-card:hover:not([disabled]):not(.is-maxed){border-color:var(--mint);background:#1a313a}
.sr-card-head{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:12px}
.sr-keycap{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:6px;
  background:#0b161c;
  border:1px solid var(--line);
  font:700 14px Consolas,monospace;
  color:var(--mint);
}
.sr-card-title{font-size:18px;line-height:1.3;color:var(--ink)}
.sr-card-body{margin:0;font-size:16.5px;line-height:1.5;color:#d6e2e3}
.sr-card-badge{
  font:700 12px Consolas,monospace;
  letter-spacing:.8px;
  padding:5px 10px;
  border-radius:6px;
  white-space:nowrap;
}
.sr-card-badge.is-active{background:#0f2128;color:var(--muted);border:1px solid var(--line)}
.sr-card-badge.is-discarded{background:#3c1d22;color:#ffb4a8;border:1px solid var(--sr-red)}
.sr-card-badge.is-locked{background:#12252d;color:var(--muted);border:1px solid var(--line)}
.sr-card-badge.is-muted{background:#101c22;color:#7f9698;border:1px dashed var(--line)}

.sr-card.is-discarded{
  background:#22181c;
  border:2px dashed var(--sr-red);
}
.sr-card.is-discarded .sr-card-title,
.sr-card.is-discarded .sr-card-body{
  text-decoration:line-through;
  text-decoration-thickness:2px;
  opacity:.74;
}
.sr-card.is-discarded .sr-keycap{border-color:var(--sr-red);color:var(--sr-red)}
.sr-card.is-maxed{opacity:.68}
.sr-card.is-locked[disabled]{opacity:.88;cursor:default}
.sr-shortcuts{margin:14px 0 0}

/* Slide 6: Validation */
.sr-summary-strip{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:14px 18px}
.sr-stat-chip{font:14px Consolas,monospace;padding:6px 12px;border-radius:6px;background:#0c1920;border:1px solid var(--line)}
.sr-stat-chip.is-neutralized{border-color:var(--sr-green);color:var(--sr-green)}
.sr-stat-chip.is-conserved{border-color:var(--sr-cyan);color:var(--sr-cyan)}
.sr-stat-chip.is-critical-error{border-color:var(--sr-red);color:var(--sr-red)}
.sr-stat-chip.is-active-trap{border-color:var(--sr-trap);color:var(--sr-trap)}
.sr-incomplete-note{background:#232018;border-left:4px solid var(--orange);padding:12px 16px;margin:0 0 16px;font-size:15px;color:#ffe2c6}

.sr-validation-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sr-val-card{
  padding:18px 20px;
  border-radius:12px;
  border:1px solid var(--line);
  border-left-width:5px;
  background:var(--panel);
}
.sr-val-card:nth-child(5){grid-column:1 / -1}
.sr-val-card.is-neutralized{background:var(--sr-green-bg);border-color:#2b5d40;border-left-color:var(--sr-green)}
.sr-val-card.is-conserved{background:var(--sr-cyan-bg);border-color:#28505f;border-left-color:var(--sr-cyan)}
.sr-val-card.is-critical-error{background:var(--sr-red-bg);border-color:#69303a;border-left-color:var(--sr-red)}
.sr-val-card.is-active-trap{background:var(--sr-trap-bg);border-color:#693d2d;border-left-color:var(--sr-trap)}

.sr-val-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sr-val-title{font-size:19px;margin:0 0 4px}
.sr-val-quote{margin:0;font-size:14px;color:var(--muted)}
.sr-status-pill{
  font:700 12px Consolas,monospace;
  letter-spacing:.7px;
  padding:6px 11px;
  border-radius:6px;
  white-space:nowrap;
}
.sr-status-pill.is-neutralized{background:#0f241b;color:var(--sr-green);border:1px solid var(--sr-green)}
.sr-status-pill.is-conserved{background:#0e2028;color:var(--sr-cyan);border:1px solid var(--sr-cyan)}
.sr-status-pill.is-critical-error{background:#241115;color:var(--sr-red);border:1px solid var(--sr-red)}
.sr-status-pill.is-active-trap{background:#241611;color:var(--sr-trap);border:1px solid var(--sr-trap)}

.sr-val-meta{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin:0 0 12px;
  padding:10px 12px;
  border-radius:8px;
  background:#0a151bd9;
}
.sr-val-meta dt{font:11px Consolas,monospace;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.sr-val-meta dd{margin:0;font-size:14px;font-weight:600;color:var(--ink)}
.sr-val-impact{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink)}

/* Slide 7: Simulation */
.sr-sim-hero{display:grid;grid-template-columns:minmax(290px,.9fr) 1.3fr;gap:18px;margin-bottom:22px}
.sr-score-card.is-optimal{border-color:var(--sr-green);background:var(--sr-green-bg)}
.sr-score-card.is-compromised{border-color:var(--orange);background:#251f18}
.sr-score-card.is-critical{border-color:var(--sr-red);background:var(--sr-red-bg)}
.sr-score-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:10px 0 14px}
.sr-score-num{font-size:clamp(48px,4.8vw,66px);font-weight:800;line-height:1;letter-spacing:-2px}
.sr-level-pill{font:700 14px Consolas,monospace;letter-spacing:1px;padding:7px 14px;border-radius:8px;border:1px solid currentColor}
.sr-level-pill.is-optimal{color:var(--sr-green);background:#0d2118}
.sr-level-pill.is-compromised{color:var(--orange);background:#1f1810}
.sr-level-pill.is-critical{color:var(--sr-red);background:#221014}
.sr-meter{height:10px;background:#091319;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px}
.sr-meter-fill{height:100%;transition:width .25s ease-out}
.sr-meter-fill.is-optimal{background:var(--sr-green)}
.sr-meter-fill.is-compromised{background:var(--orange)}
.sr-meter-fill.is-critical{background:var(--sr-red)}
.sr-formula{margin:0}
.sr-conclusion-card{display:flex;flex-direction:column;justify-content:space-between}
.sr-conclusion-text{font-size:18px;line-height:1.55;margin:10px 0 12px;color:var(--ink)}
.sr-disclaimer{margin:0;border-top:1px solid var(--line);padding-top:10px}

.sr-section-heading{margin:6px 0 14px;font-size:20px}
.sr-indicators-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.sr-ind-card,.sr-behavior-card{border-left-width:4px;padding:18px 20px}
.sr-behavior-card{margin-bottom:16px}
.sr-ind-card.is-favorable,.sr-behavior-card.is-favorable{border-left-color:var(--sr-green)}
.sr-ind-card.is-vulnerable,.sr-behavior-card.is-vulnerable{border-left-color:var(--sr-trap);background:#221819}
.sr-ind-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sr-ind-head h3{font-size:18px;margin:0}
.sr-ind-card p,.sr-behavior-card p{margin:0;font-size:15px;line-height:1.55;color:#d6e3e4}
.sr-ind-badge{font:700 12px Consolas,monospace;padding:5px 10px;border-radius:6px}
.sr-ind-badge.is-favorable{color:var(--sr-green);background:#10251c;border:1px solid #2b5d40}
.sr-ind-badge.is-vulnerable{color:var(--sr-trap);background:#291714;border:1px solid #6b3b2f}

.sr-breakdown-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:8px}
.sr-b-box{padding:16px}
.sr-b-box.is-conserved h4{color:var(--sr-cyan)}
.sr-b-box.is-neutralized h4{color:var(--sr-green)}
.sr-b-box.is-critical-error h4{color:var(--sr-red)}
.sr-b-box.is-active-trap h4{color:var(--sr-trap)}
.sr-mini-list{margin:0;padding-left:18px;font-size:14px;line-height:1.55}
.sr-mini-list li{margin:5px 0}
.sr-empty{margin:0;font-size:14px;color:var(--muted)}
.sr-stage-actions{margin-top:20px}
.sr-closing{margin-top:26px;border-color:var(--mint);border-width:2px}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:1100px){
  .sr-validation-list,.sr-sim-hero,.sr-breakdown-grid{grid-template-columns:1fr 1fr}
  .sr-sim-hero{grid-template-columns:1fr}
  .sr-val-card:nth-child(5){grid-column:auto}
}
@media(max-width:1000px){
  .shell{grid-template-columns:1fr}
  nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  nav button{white-space:nowrap}
  .navfoot{display:none}
  .hero{min-height:0}
  .evidence,.sr-validation-list{grid-template-columns:1fr}
  .hero h1{font-size:50px}
}
@media(max-width:740px){
  header{flex-wrap:wrap;padding:18px}
  header b{font-size:13px}
  .hero,.split,.sr-cards,.sr-indicators-grid,.sr-breakdown-grid,.sr-val-meta{grid-template-columns:1fr}
  .sr-card:nth-child(5){grid-column:auto}
  .hero{gap:10px}
  .hero h1{font-size:46px}
  main{padding:26px 18px}
  .poll{grid-template-columns:1fr}
  .poll button{min-height:70px}
  .big{font-size:55px}
  .footer{align-items:flex-start;flex-wrap:wrap}
  .sr-card-head{grid-template-columns:28px 1fr}
  .sr-card-badge{grid-column:1 / -1;justify-self:start}
  .sr-val-top{flex-direction:column}
  .modal{padding:12px}
  .modal>div{padding:22px}
}
@media print{
  header,nav,.footer,button,.teacher{display:none!important}
  .shell{display:block}
  body,main,.panel,.sr-val-card,.sr-ind-card,.sr-behavior-card,.sr-score-card{background:white!important;color:black!important;border-color:#999!important}
  .small,.lede,.sr-val-quote{color:#333!important}
  main{padding:0}
  .modal{position:static;background:white}
}

</script><script>window.RESEARCH_TEXT = "# Why Do Earthquakes Damage Some Places More Than Others?\n\n**Abstract**\n\nThe magnitude of an earthquake tells us how much energy is released, but it does not explain why some places suffer more damage than others. This research focuses on how different soil conditions and building structures can influence the damage caused by earthquakes. To investigate this, I analyzed information from two important earthquakes: Loma Prieta in 1989 and Christchurch in 2011. The results show that areas with soft or water-saturated soils can experience stronger shaking and liquefaction, which can seriously damage building foundations. Also, older buildings without proper reinforcement are generally more vulnerable than modern buildings designed to resist earthquakes. These findings suggest that earthquake damage depends not only on magnitude, but also on local ground conditions and the quality of buildings.\n\n**Introduction**\n\nWhen we hear about an earthquake, one of the first things we usually want to know is its magnitude. However, magnitude does not tell us everything about the damage it can cause. Sometimes, an earthquake can destroy an entire neighborhood while another area nearby suffers almost no damage.\n\nThis research investigates why this happens, focusing mainly on two factors: the type of ground where buildings are located and how those buildings are constructed. Understanding these differences is important because it can help us prevent damage in the future by improving building designs, choosing safer places for construction and using stronger foundations. The main hypothesis of this research is that earthquakes cause more damage in areas with weak soil conditions or poorly constructed buildings, even when other places experience the same earthquake. \n\nTo investigate this idea, we will focus on two predictions. First, areas with soft or wet soils should experience stronger shaking or more ground movement. Second, older or weaker buildings should suffer more damage than modern buildings in similar conditions. To test these predictions, I will use information and observations from two real earthquakes: the 1989 Loma Prieta earthquake in California and the 2011 Christchurch earthquake in New Zealand.\n\n# Theoretical Background\n\nBefore analyzing the earthquakes, it is important to understand the difference between magnitude and intensity. Magnitude measures the total energy released by an earthquake, so each earthquake has only one magnitude value. On the other hand, intensity describes how strongly the earthquake is felt in a particular location and the damage it produces there. This means that the same earthquake can have different intensity values depending on the area. Some important factors are the distance from the fault, the depth of the earthquake and the type of soil found in each location.\n\nSoil conditions can have a major influence on the damage caused by earthquakes. When seismic waves travel through soft soils, they can produce stronger shaking than when they travel through solid rock. Another important problem is liquefaction, which happens when loose, sandy soil containing a lot of water temporarily loses its strength during an earthquake and starts behaving almost like a liquid.When liquefaction occurs, the ground can sink, crack or move sideways. This can damage the foundations of buildings, roads and underground pipes, even when the structures above them are relatively strong.\n\nAnother important factor is the quality of the buildings themselves. Different structures react differently to earthquakes depending on their materials, height, weight and design. For example, old brick buildings without steel reinforcement are usually more vulnerable because their walls can separate from the floors or roofs during strong shaking. Modern buildings, especially those designed to resist earthquakes, usually perform better because they can absorb and distribute seismic forces more effectively. However, this does not mean that every modern building is completely safe. In general, earthquake damage depends on the combination of natural conditions and how vulnerable the buildings and infrastructure are.\n\n# Research\n\nFor this research, we used scientific reports and studies about two earthquakes that caused important damage in urban areas. These are the 1989 Loma Prieta earthquake in the United States and the 2011 Christchurch earthquake in New Zealand. The information comes mainly from reports published by the United States Geological Survey (USGS) and engineering studies carried out after the earthquakes.We compared three main aspects: the behavior of the soil, the damage suffered by different types of buildings, and other factors that could explain the results, such as the distance from the fault.\n\n## Loma Prieta in 1989\n\nOn October 17, 1989, a magnitude 6.9 earthquake struck California. Although a lot of damage occurred near the epicenter, some areas of Oakland and San Francisco, which were farther away, also experienced serious destruction. \n\nAccording to USGS investigations, soft soils increased the strength of shaking in some areas, sometimes making it about twice as strong. Researchers also found that wet sandy soils and artificial landfills around San Francisco Bay experienced liquefaction. One of the most affected locations was the Marina District in San Francisco. In this area, the soft ground made the shaking stronger, while liquefaction caused problems with the soil supporting the buildings. This is a good example of why magnitude alone cannot explain earthquake damage. Even places that are not very close to the epicenter can suffer serious destruction if the ground conditions are unfavorable. \n\nThe buildings themselves also played an important role. USGS reports showed that modern buildings designed to resist earthquakes generally performed better than older brick buildings without reinforcement. Another important example was the Cypress Street Viaduct in Oakland, which suffered a major collapse. Its structural weaknesses, together with the ground conditions, contributed to the severity of the damage.\n\nThese observations show that both soil conditions and construction quality are important when trying to understand why some areas are more affected than others.\n\n## Christchurch in 2011\n\nThe Christchurch earthquake of February 22, 2011, in New Zealand is another example of how damage can vary between different areas of the same city. After the earthquake, researchers found many signs of liquefaction, including sand coming up to the surface, cracks in the ground and areas where the soil had sunk.\n\nThe eastern suburbs of Christchurch were especially affected because they had wet, sandy soils that reacted badly to the strong shaking. According to engineering reports, ground movement damaged around 15,000 homes. In many cases, the buildings themselves had not been seriously damaged by the shaking, but the movement of the ground underneath them caused major problems.This shows that earthquakes do not always damage buildings directly. Sometimes, the biggest problem is that the ground supporting them becomes unstable.\n\nResearchers also inspected different types of buildings, including approximately 650 unreinforced brick buildings, 90 stone buildings without reinforcement and 342 concrete block buildings. Their observations showed that modern concrete-frame buildings generally performed better, while older unreinforced brick buildings suffered much more damage. However, two modern concrete office buildings also collapsed, showing that modern construction does not guarantee complete safety. \n\nAnother interesting point is the comparison with the 2010 Darfield earthquake. Even though the Darfield earthquake had a higher magnitude, the Christchurch earthquake caused much more severe damage in the city. One of the main reasons was that the 2011 earthquake occurred closer to the city center and at a shallower depth. This produced extremely strong shaking in urban areas.\n\nConsequently, the Christchurch earthquake shows that magnitude is not the only important factor. The location and depth of the earthquake, together with soil conditions and the quality of buildings, can have a major influence on the damage.\n\n# Discussion\n\nAfter analyzing both earthquakes, we found evidence supporting the two predictions presented in the introduction. In Loma Prieta, scientists observed that areas with soft soils experienced stronger shaking and liquefaction. They also found important differences between the performance of modern buildings and older brick structures.\n\nSomething similar happened in Christchurch, where researchers recorded severe ground movement in areas with wet, sandy soils. The building inspections also showed that structures without proper reinforcement were generally more vulnerable. These results suggest that local geological conditions and building quality play a very important role in determining how much damage an earthquake causes.\n\nHowever, there are other factors that must also be considered. For example, the distance from the fault and the strength of the shaking are clearly important. A building located very close to the fault can experience extreme shaking even if it is built on solid ground. Nevertheless, these factors do not explain every difference in damage. Soil liquefaction and structural weaknesses can make the situation much worse, even in areas located farther away.\n\nIt is also important to understand that soft soils do not always cause severe destruction and that modern buildings are not completely protected from earthquakes. Liquefaction, for example, only happens under certain soil and water conditions. Overall, the evidence shows that earthquake damage is the result of several factors working together, rather than just the magnitude of the event.\n\n# Conclusion\n\nIn conclusion, the research supports the hypothesis that earthquakes affect some places more seriously than others because of differences in soil conditions and building quality. The examples of Loma Prieta in 1989 and Christchurch in 2011 show that the magnitude of an earthquake does not determine how much damage every area will experience.\n\nOne of the most important factors is the type of ground. Soft soils can increase the strength of seismic shaking, while water-saturated sandy soils can experience liquefaction. This can make the ground unstable and cause serious problems for buildings, even in places that are not very close to the epicenter. Another important factor is how buildings are constructed. Older structures without proper reinforcement are generally more vulnerable to strong shaking, while modern buildings designed to resist earthquakes usually perform better.\n\nHowever, the research also shows that no single factor can completely explain earthquake damage. Distance from the fault, earthquake depth, local geology and construction quality all influence the final results.\n\nTherefore, we can conclude that the hypothesis is supported by the evidence from both earthquakes. Understanding these differences is important because it can help us design safer buildings, improve urban planning and reduce the damage caused by future earthquakes.\n\nThese findings also connect with Pope Francis’s message in Laudato Si’. He links housing to human dignity and calls for residents to take part in decisions about their neighbourhoods (Francis, 2015, paras. 150–152). Applied to earthquake risk, this means using scientific knowledge to plan safer communities and improve vulnerable buildings.\n\nFrancis also argues that the common good requires special concern for the poorest (2015, para. 158). In earthquake preparation, this means helping families who cannot afford safer homes or repairs. Although we cannot stop tectonic earthquakes, responsible planning and fair access to protection can reduce suffering and show care for our common home.\n\n**Bibliography**\n\n(2026, October 13). Earthquake loma prieta California 1989, Nisit.gov. \n\n[https://www.nist.gov/el/earthquake-loma-prieta-california-1989](https://www.nist.gov/el/earthquake-loma-prieta-california-1989) \n\n(2026, October 13). Christchurch earthquake, New Zealand 2011, knowledge.aidr.org.au \n\n[https://knowledge.aidr.org.au/resources/earthquake-christchurch-new-zealand-2011/](https://knowledge.aidr.org.au/resources/earthquake-christchurch-new-zealand-2011/) \n\n(2026, October 13). Christchurch earthquake kills 185, nzhistory.govt.nz \n\n[https://www.usgs.gov/faqs/why-do-earthquakes-other-countries-seem-cause-more-damage-and-casualties-earthquakes-us](https://www.usgs.gov/faqs/why-do-earthquakes-other-countries-seem-cause-more-damage-and-casualties-earthquakes-us) \n\n(2026, October 13). What is the difference between earthquake magnitude and earthquake intensity? What is the Modified Mercalli intensity scale? usgs.gov \n\n[https://www.usgs.gov/faqs/what-difference-between-earthquake-magnitude-and-earthquake-intensity-what-modified-mercalli](https://www.usgs.gov/faqs/what-difference-between-earthquake-magnitude-and-earthquake-intensity-what-modified-mercalli) \n\n(2026, October 13). M 6.9 October 17, 1989 Loma prieta earthquake, usgs.gov \n\n[https://www.usgs.gov/programs/earthquake-hazards/science/m-69-october-17-1989-loma-prieta-earthquake](https://www.usgs.gov/programs/earthquake-hazards/science/m-69-october-17-1989-loma-prieta-earthquake) \n\nFrancis. (2015, May 24). *Laudato si’*. Vatican. https://www.vatican.va/content/francesco/en/encyclicals/documents/papa-francesco_20150524_enciclica-laudato-si.html\n\n";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function defaultSurvival() {
  return {
    selectedIds: [],
    remainingMs: MISSION.survivalConfig.timerDurationMs,
    remainingSeconds: MISSION.survivalConfig.timerDurationSeconds,
    timerStatus: 'idle',
    phase: 'decision',
    evaluated: false,
    closingOpen: false
  };
}

function defaults() {
  return {
    step: 0,
    lang: 'es',
    teacher: false,
    vote: null,
    case: 'loma',
    soil: 'rock',
    design: 'good',
    labRuns: 0,
    visited: ['loma'],
    survival: defaultSurvival()
  };
}

function sanitizeSurvival(raw) {
  const base = defaultSurvival();
  if (!raw || typeof raw !== 'object') return base;
  const cfg = MISSION.survivalConfig;
  const validIds = new Set(MISSION.options.map(o => o.id));
  if (Array.isArray(raw.selectedIds)) {
    base.selectedIds = [...new Set(raw.selectedIds.map(Number))]
      .filter(id => Number.isInteger(id) && validIds.has(id))
      .slice(0, cfg.maxDiscards);
  }
  if (typeof raw.remainingMs === 'number' && Number.isFinite(raw.remainingMs)) {
    base.remainingMs = Math.max(0, Math.min(cfg.timerDurationMs, Math.round(raw.remainingMs)));
  } else if (typeof raw.remainingSeconds === 'number' && Number.isFinite(raw.remainingSeconds)) {
    const clampedSec = Math.max(0, Math.min(cfg.timerDurationSeconds, Math.round(raw.remainingSeconds)));
    base.remainingMs = clampedSec * 1000;
  }
  base.remainingSeconds = Math.max(0, Math.min(cfg.timerDurationSeconds, Math.ceil(base.remainingMs / 1000)));
  if (base.remainingMs <= 0) {
    base.remainingMs = 0;
    base.remainingSeconds = 0;
    base.timerStatus = 'expired';
  } else if (raw.timerStatus === 'expired') {
    base.remainingMs = 0;
    base.remainingSeconds = 0;
    base.timerStatus = 'expired';
  } else if ((raw.timerStatus === 'paused' || raw.timerStatus === 'running') && base.remainingMs < cfg.timerDurationMs) {
    base.timerStatus = 'paused';
  } else {
    base.timerStatus = 'idle';
  }
  base.evaluated = raw.evaluated === true;
  base.closingOpen = raw.closingOpen === true;
  if (base.closingOpen) {
    base.phase = 'closing';
  } else if (['decision', 'validation', 'simulation', 'closing'].includes(raw.phase)) {
    base.phase = raw.phase === 'closing' ? 'simulation' : raw.phase;
  } else {
    base.phase = base.evaluated ? 'validation' : 'decision';
  }
  return base;
}

let state = defaults(), storageAvailable = true;
try {
  const x = JSON.parse(localStorage.getItem('seismic-mission-v1') || 'null');
  if (x && typeof x === 'object') {
    state.step = Number.isInteger(x.step) && x.step >= 0 && x.step < 7 ? x.step : 0;
    state.lang = x.lang === 'en' ? 'en' : 'es';
    state.teacher = x.teacher === true;
    state.vote = ['a', 'b', 'c'].includes(x.vote) ? x.vote : null;
    state.case = x.case === 'christchurch' ? 'christchurch' : 'loma';
    state.soil = ['rock', 'soft', 'wet'].includes(x.soil) ? x.soil : 'rock';
    state.design = x.design === 'weak' ? 'weak' : 'good';
    state.labRuns = Number.isInteger(x.labRuns) && x.labRuns >= 0 ? x.labRuns : 0;
    state.visited = Array.isArray(x.visited) ? x.visited.filter(v => ['loma', 'christchurch'].includes(v)) : ['loma'];
    if (state.visited.length === 0) state.visited = ['loma'];
    state.survival = sanitizeSurvival(x.survival);
  }
} catch {
  storageAvailable = false;
}

function tr(es, en) { return state.lang === 'es' ? es : en; }
function t(pair) { return pair[state.lang === 'es' ? 0 : 1]; }
const box = (c, x) => '<div class="' + c + '">' + x + '</div>';
const p = (x, c = '') => '<p' + (c ? ' class="' + c + '"' : '') + '>' + x + '</p>';
const h = x => '<h3>' + x + '</h3>';
function btn(label, action, cls = '', extra = '') {
  return '<button type="button"' + (cls ? ' class="' + cls + '"' : '') + (extra ? ' ' + extra : '') + ' onclick="' + action + '">' + label + '</button>';

function detail(title, body) { return '<details><summary>' + title + '</summary>' + p(body) + '</details>'; }
function head(label, title, body = '') {
  return box('eyebrow', label) + '<h2 tabindex="-1" id="pageTitle">' + title + '</h2>' + (body ? p(body, 'lede') : '');

function save() {
  try { localStorage.setItem('seismic-mission-v1', JSON.stringify(state)); } catch { storageAvailable = false; }
}

let toastTimeout, labTimeout, modalFocus;
let survivalTimerId = null;
let survivalDeadlineMs = 0;

function nowMs() {
  return Date.now();
}

function stopSurvivalInterval() {
  if (survivalTimerId !== null) {
    if (typeof clearInterval === 'function') clearInterval(survivalTimerId);
    survivalTimerId = null;
  }
}

function formatSurvivalClock(seconds = state.survival.remainingSeconds) {
  const safe = Math.max(0, Math.floor(Number.isFinite(seconds) ? seconds : 0));
  return '00:' + String(safe).padStart(2, '0');
}

function isDecisionLocked(session = state.survival) {
  return Boolean(session.evaluated || session.timerStatus === 'expired');
}

function canEvaluatePlan(session = state.survival) {
  return Boolean(
    session.evaluated ||
    session.selectedIds.length === MISSION.survivalConfig.maxDiscards ||
    session.timerStatus === 'expired'
  );
}

function getTimerVisualMeta(session = state.survival) {
  const cfg = MISSION.survivalConfig;
  const pct = Math.max(0, Math.min(100, (session.remainingMs / cfg.timerDurationMs) * 100));
  const isExpired = session.timerStatus === 'expired' || session.remainingSeconds <= 0;
  const isWarning = !isExpired && session.remainingSeconds <= cfg.warningThresholdSeconds;
  let stateClass = 'is-normal';
  let statusText = tr('Detenido · Listo para iniciar', 'Stopped · Ready to start');
  if (session.evaluated) {
    stateClass = 'is-locked';
    statusText = tr('Evaluación confirmada · Decisiones bloqueadas', 'Evaluation confirmed · Decisions locked');
  } else if (isExpired) {
    stateClass = 'is-expired';
    statusText = tr('Tiempo agotado · Selecciones bloqueadas', 'Time expired · Selections locked');
  } else if (session.timerStatus === 'running' && isWarning) {
    stateClass = 'is-warning';
    statusText = tr('⚠ Últimos 10 segundos · Cierren descartes', '⚠ Final 10 seconds · Lock in discards');
  } else if (session.timerStatus === 'running') {
    stateClass = 'is-running';
    statusText = tr('Cuenta regresiva en curso', 'Countdown running');
  } else if (session.timerStatus === 'paused') {
    stateClass = isWarning ? 'is-warning' : 'is-paused';
    statusText = tr('En pausa · Podés reanudar', 'Paused · Ready to resume');
  }
  return { pct, isExpired, isWarning, stateClass, statusText };
}

function syncTimerDOM() {
  const clockEl = $('#srClock');
  const barEl = $('#srTimerBar');
  const trackEl = $('#srTimerTrack');
  const boxEl = $('#srTimerBox');
  const statusEl = $('#srTimerStatus');
  const meta = getTimerVisualMeta(state.survival);
  if (clockEl) clockEl.textContent = formatSurvivalClock(state.survival.remainingSeconds);
  if (barEl && barEl.style) barEl.style.width = meta.pct.toFixed(1) + '%';
  if (trackEl && trackEl.setAttribute) trackEl.setAttribute('aria-valuenow', String(state.survival.remainingSeconds));
  if (statusEl) statusEl.textContent = meta.statusText;
  if (boxEl) boxEl.className = 'sr-timer panel ' + meta.stateClass;
}

function survivalTick() {
  if (state.survival.timerStatus !== 'running' || state.step !== 4) {
    pauseSurvivalTimer(true);
    return;
  }
  const cfg = MISSION.survivalConfig;
  const remMs = Math.max(0, survivalDeadlineMs - nowMs());
  const remSec = Math.max(0, Math.min(cfg.timerDurationSeconds, Math.ceil(remMs / 1000)));
  state.survival.remainingMs = remMs;
  state.survival.remainingSeconds = remSec;
  if (remMs <= 0) {
    stopSurvivalInterval();
    state.survival.remainingMs = 0;
    state.survival.remainingSeconds = 0;
    state.survival.timerStatus = 'expired';
    save();
    toast(tr('Tiempo agotado. Selecciones bloqueadas: ya se puede evaluar el plan.', 'Time is up. Selections locked: you may now evaluate the plan.'));
    render();
    return;
  }
  syncTimerDOM();
}

function timerStart() {
  if (state.step !== 4) return false;
  if (isDecisionLocked()) return false;
  if (state.survival.timerStatus === 'running') return false;
  if (state.survival.remainingMs <= 0) return false;
  stopSurvivalInterval();
  survivalDeadlineMs = nowMs() + state.survival.remainingMs;
  state.survival.timerStatus = 'running';
  save();
  render();
  survivalTimerId = setInterval(survivalTick, MISSION.survivalConfig.timerTickMs);
  return true;
}

function pauseSurvivalTimer(silent = false) {
  if (state.survival.timerStatus !== 'running') {
    stopSurvivalInterval();
    return false;
  }
  const cfg = MISSION.survivalConfig;
  const remMs = Math.max(0, survivalDeadlineMs - nowMs());
  stopSurvivalInterval();
  if (remMs <= 0) {
    state.survival.remainingMs = 0;
    state.survival.remainingSeconds = 0;
    state.survival.timerStatus = 'expired';
  } else {
    state.survival.remainingMs = remMs;
    state.survival.remainingSeconds = Math.max(0, Math.min(cfg.timerDurationSeconds, Math.ceil(remMs / 1000)));
    state.survival.timerStatus = 'paused';
  }
  save();
  if (!silent) render();
  return true;
}

function timerPause() {
  return pauseSurvivalTimer(false);
}

function timerReset(goDecision = false) {
  stopSurvivalInterval();
  survivalDeadlineMs = 0;
  state.survival = defaultSurvival();
  save();
  if (goDecision && state.step !== 4) go(4);
  else render();
  return true;
}

function toggleDiscard(id, viaKeyboard = false) {
  const numId = Number(id);
  const option = MISSION.options.find(o => o.id === numId);
  if (!option) return false;
  if (isDecisionLocked()) return false;

  if (state.survival.timerStatus === 'running') {
    const cfg = MISSION.survivalConfig;
    const remMs = Math.max(0, survivalDeadlineMs - nowMs());
    state.survival.remainingMs = remMs;
    state.survival.remainingSeconds = Math.max(0, Math.min(cfg.timerDurationSeconds, Math.ceil(remMs / 1000)));
    if (remMs <= 0) {
      stopSurvivalInterval();
      state.survival.timerStatus = 'expired';
      save();
      render();
      return false;
    }
  }

  const current = state.survival.selectedIds;
  if (current.includes(numId)) {
    state.survival.selectedIds = current.filter(x => x !== numId);
  } else {
    if (current.length >= MISSION.survivalConfig.maxDiscards) {
      toast(tr('Solo se permiten 2 descartes. Desmarcá una opción si querés cambiarla.', 'Maximum of 2 discards allowed. Deselect an option to change it.'));
      return false;
    }
    state.survival.selectedIds = [...current, numId];
  }
  save();
  render();
  if (viaKeyboard) $('#srCard-' + numId)?.focus({ preventScroll: true });
  return true;
}

/* --- Pure Evaluation & Resilience Domain Logic (DOM-independent) --- */

function classifyOptionDecision(realType, decision) {
  if (realType === 'trap' && decision === 'discarded') {
    return {
      outcome: 'neutralized',
      tone: 'neutralized',
      icon: '✓',
      badge: ['NEUTRALIZADA', 'NEUTRALIZED'],
      result: ['Neutralizada', 'Neutralized']
    };
  }
  if (realType === 'trap' && decision === 'retained') {
    return {
      outcome: 'active_trap',
      tone: 'active-trap',
      icon: '⚠',
      badge: ['TRAMPA ACTIVA', 'ACTIVE TRAP'],
      result: ['Trampa activa: riesgo residual', 'Active trap: residual risk']
    };
  }
  if (realType === 'valid' && decision === 'retained') {
    return {
      outcome: 'conserved',
      tone: 'conserved',
      icon: '●',
      badge: ['MEDIDA CONSERVADA', 'MEASURE CONSERVED'],
      result: ['Medida vital conservada', 'Vital measure conserved']
    };
  }
  return {
    outcome: 'critical_error',
    tone: 'critical-error',
    icon: '✕',
    badge: ['ERROR CRÍTICO', 'CRITICAL ERROR'],
    result: ['Error crítico: medida vital omitida', 'Critical error: vital measure omitted']
  };
}

function evaluateSurvivalPlan(selectedIds = state.survival.selectedIds) {
  const validOptionIds = new Set(MISSION.options.map(o => o.id));
  const cleanDiscards = Array.isArray(selectedIds)
    ? [...new Set(selectedIds.map(Number))].filter(id => validOptionIds.has(id)).sort((a, b) => a - b)
    : [];
  const discardedSet = new Set(cleanDiscards);

  const items = MISSION.options.map(option => {
    const decision = discardedSet.has(option.id) ? 'discarded' : 'retained';
    const meta = classifyOptionDecision(option.type, decision);
    return {
      id: option.id,
      indicatorKey: option.indicatorKey,
      realType: option.type,
      decision,
      outcome: meta.outcome,
      tone: meta.tone,
      icon: meta.icon,
      title: option.title,
      statement: option.statement,
      decisionLabel: decision === 'discarded'
        ? ['Descartada por el equipo', 'Discarded by team']
        : ['No descartada (conservada)', 'Not discarded (retained)'],
      realClassLabel: option.type === 'valid'
        ? ['Medida preventiva válida', 'Valid preventive measure']
        : ['Trampa técnica / mito ineficaz', 'Technical trap / ineffective myth'],
      badge: meta.badge,
      result: meta.result,
      explanation: decision === 'discarded' ? option.validation.discarded : option.validation.retained,
      simulationData: option.simulation
    };
  });

  return {
    selectedIds: cleanDiscards,
    discardCount: cleanDiscards.length,
    items,
    conserved: items.filter(i => i.outcome === 'conserved'),
    neutralized: items.filter(i => i.outcome === 'neutralized'),
    criticalErrors: items.filter(i => i.outcome === 'critical_error'),
    activeTraps: items.filter(i => i.outcome === 'active_trap')
  };
}

function calculateResilience(evaluationOrSelectedIds = state.survival.selectedIds) {
  const evaluation = evaluationOrSelectedIds && Array.isArray(evaluationOrSelectedIds.items)
    ? evaluationOrSelectedIds
    : evaluateSurvivalPlan(evaluationOrSelectedIds);
  const cfg = MISSION.survivalConfig;
  const validRetained = evaluation.conserved.length;
  const trapsDiscarded = evaluation.neutralized.length;
  const rawScore = (cfg.validKeepPoints * validRetained) + (cfg.trapDiscardPoints * trapsDiscarded);
  const score = Math.round(rawScore);

  let level = 'critical';
  let label = ['CRÍTICO', 'CRITICAL'];
  if (rawScore >= cfg.optimalMinScore) {
    level = 'optimal';
    label = ['ÓPTIMO', 'OPTIMAL'];
  } else if (rawScore >= cfg.compromisedMinScore) {
    level = 'compromised';
    label = ['COMPROMETIDO', 'COMPROMISED'];
  }

  return {
    validRetained,
    trapsDiscarded,
    rawScore,
    score,
    level,
    label
  };
}

function buildDynamicConclusion(evaluation, resilience) {
  const v = resilience.validRetained;
  const n = resilience.trapsDiscarded;
  const errs = evaluation.criticalErrors;
  const traps = evaluation.activeTraps;

  if (v === 3 && n === 2) {
    return [
      'Acierto pleno: el equipo conservó las tres barreras de ingeniería y planificación territorial y neutralizó ambos mitos operativos, logrando la máxima resiliencia del escenario.',
      'Full accuracy: the team preserved all three engineering and land-use safeguards while neutralizing both operational myths, achieving peak scenario resilience.'
    ];
  }
  if (v === 3 && n === 1) {
    const remTrap = traps[0];
    return [
      'Buen criterio estructural: se protegieron las tres medidas vitales, pero permaneció activa una trampa (' + remTrap.title[0] + '), dejando un riesgo conductual o de evacuación evitable.',
      'Strong structural judgement: all three vital measures were preserved, but one trap remained active (' + remTrap.title[1] + '), leaving an avoidable behavioural or evacuation risk.'
    ];
  }
  if (v === 3 && n === 0) {
    return [
      'Infraestructura conservada con riesgo conductual: no se descartaron medidas válidas, pero ambas trampas sísmicas quedaron activas en el protocolo de contingencia.',
      'Infrastructure preserved with behavioural risk: no valid measures were lost, yet both seismic traps stayed active in the contingency protocol.'
    ];
  }
  if (v === 2 && n === 1) {
    const lost = errs[0];
    const remTrap = traps[0];
    return [
      'Plan comprometido: se neutralizó una trampa, pero se descartó por error una medida vital (' + lost.title[0] + ') y siguió activa otra trampa (' + remTrap.title[0] + ').',
      'Compromised plan: one trap was neutralized, but a vital measure was mistakenly discarded (' + lost.title[1] + ') and another trap stayed active (' + remTrap.title[1] + ').'
    ];
  }
  if (v === 2 && n === 2) {
    const lost = errs[0];
    return [
      'Trampas neutralizadas con costo preventivo: se eliminaron los mitos, pero se omitió una medida vital (' + lost.title[0] + ').',
      'Traps neutralized with preventive loss: myths were removed, but one vital measure was omitted (' + lost.title[1] + ').'
    ];
  }
  if (v === 2 && n === 0) {
    const lost = errs[0];
    return [
      'Plan vulnerable: se perdió una medida preventiva vital (' + lost.title[0] + ') sin lograr descartar ninguna de las dos trampas sísmicas.',
      'Vulnerable plan: a vital preventive measure (' + lost.title[1] + ') was lost without discarding either seismic trap.'
    ];
  }
  return [
    'Plan en estado crítico: se descartaron medidas preventivas esenciales (' + errs.map(e => e.title[0]).join(', ') + ') debilitando de forma severa la capacidad de respuesta urbana ante el sismo.',
    'Plan in critical condition: essential preventive measures were discarded (' + errs.map(e => e.title[1]).join(', ') + '), severely weakening urban seismic resilience.'
  ];
}

function buildSimulationSummary(selectedIds = state.survival.selectedIds) {
  const evaluation = evaluateSurvivalPlan(selectedIds);
  const resilience = calculateResilience(evaluation);
  const byKey = Object.fromEntries(evaluation.items.map(item => [item.indicatorKey, item]));

  const hospitalItem = byKey.hospital;
  const gasItem = byKey.gasValves;
  const elevatorItem = byKey.elevators;
  const zoningItem = byKey.zoning;
  const doorMythItem = byKey.doorMyth;

  const indicators = [
    {
      code: 'A',
      key: 'hospitalIntegrity',
      sourceOptionId: hospitalItem.id,
      title: ['A. Integridad hospitalaria', 'A. Hospital integrity'],
      favorable: hospitalItem.decision === 'retained',
      status: hospitalItem.decision === 'retained' ? hospitalItem.simulationData.retainedStatus : hospitalItem.simulationData.discardedStatus,
      detail: hospitalItem.decision === 'retained' ? hospitalItem.simulationData.retainedDetail : hospitalItem.simulationData.discardedDetail
    },
    {
      code: 'B',
      key: 'secondaryFireRisk',
      sourceOptionId: gasItem.id,
      title: ['B. Riesgo de incendios secundarios', 'B. Secondary fire risk'],
      favorable: gasItem.decision === 'retained',
      status: gasItem.decision === 'retained' ? gasItem.simulationData.retainedStatus : gasItem.simulationData.discardedStatus,
      detail: gasItem.decision === 'retained' ? gasItem.simulationData.retainedDetail : gasItem.simulationData.discardedDetail
    },
    {
      code: 'C',
      key: 'evacuationInjuryRisk',
      sourceOptionId: elevatorItem.id,
      title: ['C. Riesgo de lesiones por evacuación', 'C. Evacuation injury risk'],
      favorable: elevatorItem.decision === 'discarded',
      status: elevatorItem.decision === 'discarded' ? elevatorItem.simulationData.discardedStatus : elevatorItem.simulationData.retainedStatus,
      detail: elevatorItem.decision === 'discarded' ? elevatorItem.simulationData.discardedDetail : elevatorItem.simulationData.retainedDetail
    },
    {
      code: 'D',
      key: 'geotechnicalRisk',
      sourceOptionId: zoningItem.id,

    }
  ];

  const doorFrameBehavioralRisk = {
    key: 'doorFrameMythRisk',

/* --- Phase Transitions & Navigation --- */

function confirmEvaluation() {
  if (!canEvaluatePlan()) return false;
  if (state.survival.timerStatus === 'running') {
    pauseSurvivalTimer(true);
  }
  stopSurvivalInterval();
  state.survival.evaluated = true;
  state.survival.closingOpen = false;
  state.survival.phase = 'validation';
  save();
  go(5);
  return true;
}

function advanceToSimulation() {
  if (state.survival.timerStatus === 'running') {
    pauseSurvivalTimer(true);
  }
  stopSurvivalInterval();
  state.survival.evaluated = true;
  state.survival.phase = state.survival.closingOpen ? 'closing' : 'simulation';
  save();
  go(6);
  return true;
}

function focusClosingSection() {
  const heading = $('#closingTitle');
  const section = $('#cierre');
  heading?.focus({ preventScroll: true });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (section && typeof section.scrollIntoView === 'function') {
    section.scrollIntoView({ behavior: reduceMotion ? 'instant' : 'smooth', block: 'start' });
  }
}

function continueToClosing(fromShortcut = false) {
  if (state.step !== 6) return false;
  if (state.survival.closingOpen) {
    if (fromShortcut) return false;
    focusClosingSection();
    return true;
  }
  state.survival.evaluated = true;
  state.survival.closingOpen = true;
  state.survival.phase = 'closing';
  save();
  render();
  focusClosingSection();
  return true;
}

function toast(text) {
  clearTimeout(toastTimeout);
  $('#toast').textContent = text;
  $('#toast').classList.remove('hidden');
  toastTimeout = setTimeout(() => $('#toast').classList.add('hidden'), 3500);
}

function go(n) {
  const next = Math.max(0, Math.min(6, n));
  if (state.step === 4 && next !== 4 && state.survival.timerStatus === 'running') {
    pauseSurvivalTimer(true);
  }
  state.step = next;
  save();
  render();
  $('#pageTitle')?.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
}

function footer() {
  let nextBtn = '<button type="button" class="primary" onclick="go(' + (state.step + 1) + ')" ' + (state.step === 6 ? 'disabled' : '') + '>' + tr('Continuar', 'Continue') + ' →</button>';
  if (state.step === 4) {
    nextBtn = '<button type="button" class="primary" onclick="confirmEvaluation()" ' + (!canEvaluatePlan() ? 'disabled' : '') + '>' + tr('Evaluar Plan Sísmico', 'Evaluate Seismic Plan') + ' →</button>';
  } else if (state.step === 5) {
    nextBtn = '<button type="button" class="primary" onclick="advanceToSimulation()">' + tr('Ejecutar Simulación de Impacto', 'Run Impact Simulation') + ' →</button>';
  } else if (state.step === 6) {
    nextBtn = '<button type="button" class="primary" onclick="continueToClosing()" ' + (state.survival.closingOpen ? 'disabled' : '') + '>' + tr('Continuar con el cierre', 'Continue to closing') + ' →</button>';
  }
  return '<div class="footer"><button type="button" onclick="go(' + (state.step - 1) + ')" ' + (state.step === 0 ? 'disabled' : '') + '>' + tr('Anterior', 'Back') + '</button><span>' + (state.step + 1) + ' / 7 · ' + tr('Decisiones compartidas', 'Shared decisions') + '</span>' + nextBtn + '</div>';
}

  if (e.key === 'Escape') closeModal();

    const items = [...$('#modal').querySelectorAll('button,a,[tabindex="0"]')];
    if (items.length === 0) return;
    if (e.shiftKey && document.activeElement === items[0]) { e.preventDefault(); items.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === items.at(-1)) { e.preventDefault(); items[0].focus(); }
  }
});

    else await document.documentElement.requestFullscreen();
  } catch {

  }

function handleGlobalKeydown(e) {
  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  if (!$('#modal').classList.contains('hidden')) return;
  const target = e.target || {};
  const tag = String(target.tagName || '').toUpperCase();
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || target.isContentEditable) return;

  if (state.step === 4 && ['1', '2', '3', '4', '5'].includes(e.key)) {
    e.preventDefault();
    toggleDiscard(Number(e.key), false);
    $('#pageTitle')?.focus({ preventScroll: true });
    return;
  }

  const interactiveControl = ['BUTTON', 'SUMMARY', 'A'].includes(tag) || Boolean(target.closest && target.closest('button,summary,a'));
  if (interactiveControl) return;

  if (e.code === 'Space' || e.key === ' ') {
    if (state.step === 4) {
      if (!state.survival.evaluated && state.survival.selectedIds.length === MISSION.survivalConfig.maxDiscards) {
        e.preventDefault();
        confirmEvaluation();
      }
      return;
    }
    if (state.step === 5) {
      if (state.survival.evaluated || canEvaluatePlan()) {
        e.preventDefault();
        advanceToSimulation();
      }
      return;
    }
    if (state.step === 6) {
      if (!state.survival.closingOpen) {
        e.preventDefault();
        continueToClosing(true);
      }
      return;
    }
  }

  if (e.key === 'ArrowRight') go(state.step + 1);
  if (e.key === 'ArrowLeft') go(state.step - 1);
}

document.addEventListener('keydown', handleGlobalKeydown);

        '<div class="sr-timer-top">' +
          '<div class="sr-clock-wrap">' +
            '<span class="sr-clock" id="srClock">' + formatSurvivalClock(session.remainingSeconds) + '</span>' +
            '<span class="sr-timer-status" id="srTimerStatus" aria-live="polite">' + meta.statusText + '</span>' +
          '</div>' +
          '<div class="sr-timer-controls">' +
            btn(startLabel, 'timerStart()', 'sr-btn-start', 'id="srStartBtn"' + (disableStart ? ' disabled' : '')) +
            btn(tr('Pausar', 'Pause'), 'timerPause()', '', 'id="srPauseBtn"' + (disablePause ? ' disabled' : '')) +
            btn('Reset', 'timerReset()', '', 'id="srResetBtn"') +
            btn(
              tr('Evaluar Plan Sísmico', 'Evaluate Seismic Plan'),
              'confirmEvaluation()',
              'primary sr-eval-btn',
              'id="srEvaluateBtn"' + (!canEval ? ' disabled' : '')
            ) +
          '</div>' +
        '</div>' +
        '<div class="sr-timer-track" id="srTimerTrack" role="progressbar" aria-label="' + tr('Tiempo restante', 'Remaining time') + '" aria-valuemin="0" aria-valuemax="' + cfg.timerDurationSeconds + '" aria-valuenow="' + session.remainingSeconds + '">' +
          '<div class="sr-timer-fill" id="srTimerBar" style="width:' + meta.pct.toFixed(1) + '%"></div>' +
        '</div>' +
      '</div>';

    const cardsHtml = MISSION.options.map(opt => {
      const isDiscarded = session.selectedIds.includes(opt.id);
      const isMaxedOut = !locked && !isDiscarded && count >= cfg.maxDiscards;
      const cls = [
        'sr-card',
        isDiscarded ? 'is-discarded' : 'is-retained',
        locked ? 'is-locked' : '',
        isMaxedOut ? 'is-maxed' : ''
      ].filter(Boolean).join(' ');

      let badgeHtml;
      if (isDiscarded) {
        badgeHtml = '<span class="sr-card-badge is-discarded">✕ ' + tr('DESCARTADA', 'DISCARDED') + '</span>';
      } else if (locked) {
        badgeHtml = '<span class="sr-card-badge is-locked">' + tr('BLOQUEADA', 'LOCKED') + '</span>';
      } else if (isMaxedOut) {
        badgeHtml = '<span class="sr-card-badge is-muted">' + tr('CUPO 2/2', 'LIMIT 2/2') + '</span>';
      } else {
        badgeHtml = '<span class="sr-card-badge is-active">' + tr('EN PLAN', 'IN PLAN') + '</span>';
      }

      const attrs = [
        'id="srCard-' + opt.id + '"',
        'aria-pressed="' + String(isDiscarded) + '"',
        locked ? 'disabled' : (isMaxedOut ? 'aria-disabled="true"' : '')
      ].filter(Boolean).join(' ');

      return (
        '<button type="button" class="' + cls + '" ' + attrs + ' onclick="toggleDiscard(' + opt.id + ',event.detail===0)">' +
          '<div class="sr-card-head">' +
            '<span class="sr-keycap" aria-hidden="true">' + opt.id + '</span>' +
            '<strong class="sr-card-title">' + tr('Opción ', 'Option ') + opt.id + ' — ' + esc(t(opt.title)) + '</strong>' +
            badgeHtml +
          '</div>' +
          '<p class="sr-card-body">«' + esc(t(opt.statement)) + '»</p>' +
        '</button>'
      );
    }).join('');

    const shortcutHint =
      '<p class="sr-shortcuts small">' +
        tr(
          'Atajos del presentador: teclas [1]–[5] para seleccionar o deseleccionar tarjetas · [Espacio] para confirmar al tener 2 descartes · [Enter] activa el botón enfocado.',
          'Presenter shortcuts: keys [1]–[5] to select or deselect cards · [Space] to confirm when 2 discards are selected · [Enter] activates focused control.'
        ) +
      '</p>';

    return (
      head(
        tr('04 / Survival Run · Descarte de mitos y trampas', '04 / Survival Run · Myth and trap discard'),
        tr('PLAN DE CONTINGENCIA', 'CONTINGENCY PLAN')
      ) +
      consignaBlock +
      timerBlock +
      '<div class="sr-cards" role="group" aria-label="' + tr('Opciones del plan de contingencia', 'Contingency plan options') + '">' +
        cardsHtml +
      '</div>' +
      shortcutHint
    );
  },
  function validationSlide() {
    const ev = evaluateSurvivalPlan();
    const cfg = MISSION.survivalConfig;
    const incompleteNote = ev.discardCount < cfg.maxDiscards
      ? '<p class="sr-incomplete-note">' +
          tr(
            'Se registraron ' + ev.discardCount + ' de ' + cfg.maxDiscards + ' descartes posibles. Se evalúan únicamente las decisiones reales tomadas; las opciones restantes permanecieron activas en el plan.',
            'Recorded ' + ev.discardCount + ' of ' + cfg.maxDiscards + ' possible discards. Only actual decisions are evaluated; remaining options stayed active in the plan.'
          ) +
        '</p>'
      : '';

    const summaryBar =
      '<div class="sr-summary-strip panel">' +
        '<span class="sr-stat-chip"><strong>' + ev.discardCount + '/' + cfg.maxDiscards + '</strong> ' + tr('Descartes aplicados', 'Discards applied') + '</span>' +
        '<span class="sr-stat-chip is-neutralized">✓ <strong>' + ev.neutralized.length + '</strong> ' + tr('Neutralizadas', 'Neutralized') + '</span>' +
        '<span class="sr-stat-chip is-conserved">● <strong>' + ev.conserved.length + '</strong> ' + tr('Conservadas', 'Conserved') + '</span>' +
        '<span class="sr-stat-chip is-critical-error">✕ <strong>' + ev.criticalErrors.length + '</strong> ' + tr('Errores críticos', 'Critical errors') + '</span>' +
        '<span class="sr-stat-chip is-active-trap">⚠ <strong>' + ev.activeTraps.length + '</strong> ' + tr('Trampas activas', 'Active traps') + '</span>' +
      '</div>' +
      incompleteNote;

    const reportCards = ev.items.map(item =>
      '<article class="sr-val-card is-' + item.tone + '">' +
        '<div class="sr-val-top">' +
          '<div>' +
            '<h3 class="sr-val-title">' + tr('Opción ', 'Option ') + item.id + ' — ' + esc(t(item.title)) + '</h3>' +
            '<p class="sr-val-quote">«' + esc(t(item.statement)) + '»</p>' +
          '</div>' +
          '<span class="sr-status-pill is-' + item.tone + '">' + item.icon + ' ' + esc(t(item.badge)) + '</span>' +
        '</div>' +
        '<dl class="sr-val-meta">' +
          '<div><dt>' + tr('Decisión tomada', 'Decision taken') + '</dt><dd>' + esc(t(item.decisionLabel)) + '</dd></div>' +
          '<div><dt>' + tr('Clasificación técnica real', 'Real technical classification') + '</dt><dd>' + esc(t(item.realClassLabel)) + '</dd></div>' +
          '<div><dt>' + tr('Resultado', 'Outcome') + '</dt><dd>' + esc(t(item.result)) + '</dd></div>' +
        '</dl>' +
        '<p class="sr-val-impact">' + esc(t(item.explanation)) + '</p>' +
      '</article>'
    ).join('');

    const navActions =
      '<div class="actions sr-stage-actions">' +
        btn(tr('Ejecutar Simulación de Impacto', 'Run Impact Simulation') + ' →', 'advanceToSimulation()', 'primary', 'id="srRunSimBtn"') +
        btn(tr('Volver a Decisión', 'Back to Decision'), 'go(4)') +
        '<span class="small">' + tr('[Espacio]: ejecutar simulación de impacto', '[Space]: run impact simulation') + '</span>' +
      '</div>';

    return (
      head(
        tr('05 / Survival Run · Validación técnica instantánea', '05 / Survival Run · Instant technical validation'),
        tr('Diagnóstico del plan de contingencia', 'Contingency plan diagnosis'),
        tr('Informe técnico derivado exclusivamente de las decisiones registradas en la fase anterior.', 'Technical report derived exclusively from the decisions recorded in the previous phase.')
      ) +
      summaryBar +
      '<div class="sr-validation-list">' + reportCards + '</div>' +
      navActions
    );
  },
  function simulationSlide() {
    const sim = buildSimulationSummary();
    const ev = sim.evaluation;
    const res = sim.resilience;
    const rawFormatted = String(res.rawScore).replace('.', state.lang === 'es' ? ',' : '.');

    const scoreHero =
      '<div class="sr-sim-hero">' +
        '<div class="sr-score-card panel is-' + res.level + '">' +
          '<div class="eyebrow">' + tr('Índice de resiliencia urbana', 'Urban resilience index') + '</div>' +
          '<div class="sr-score-row">' +
            '<strong class="sr-score-num" id="srResilienceScore">' + res.score + '%</strong>' +
            '<span class="sr-level-pill is-' + res.level + '" id="srResilienceLevel">' + esc(t(res.label)) + '</span>' +
          '</div>' +
          '<div class="sr-meter" aria-hidden="true"><div class="sr-meter-fill is-' + res.level + '" style="width:' + res.score + '%"></div></div>' +
          '<p class="sr-formula small">' +
            tr(
              'Cálculo determinista: 25 × ' + res.validRetained + ' válidas conservadas + 12,5 × ' + res.trapsDiscarded + ' trampas neutralizadas = ' + rawFormatted + ' pts',
              'Deterministic formula: 25 × ' + res.validRetained + ' valid conserved + 12.5 × ' + res.trapsDiscarded + ' traps neutralized = ' + rawFormatted + ' pts'
            ) +
          '</p>' +
        '</div>' +
        '<div class="panel sr-conclusion-card">' +
          '<div class="tag">' + tr('CONCLUSIÓN DINÁMICA DEL ESCENARIO', 'DYNAMIC SCENARIO CONCLUSION') + '</div>' +
          '<p class="sr-conclusion-text">' + esc(t(sim.conclusion)) + '</p>' +
          '<p class="small sr-disclaimer">' +
            tr(
              'Nota metodológica: esta puntuación es un índice didáctico de las decisiones tomadas (ÓPTIMO: 87,5–100 · COMPROMETIDO: 50–87 · CRÍTICO: 0–49). No es un modelo probabilístico ni una estimación real de daños, víctimas o pérdidas.',
              'Methodological note: this score is an educational index of the decisions made (OPTIMAL: 87.5–100 · COMPROMISED: 50–87 · CRITICAL: 0–49). It is not a probabilistic model or a real estimate of damage, casualties or losses.'
            ) +
          '</p>' +
        '</div>' +
      '</div>';

    const indicatorsHtml = sim.indicators.map(ind => {
      const toneCls = ind.favorable ? 'is-favorable' : 'is-vulnerable';
      const icon = ind.favorable ? '✓' : '⚠';
      return (
        '<article class="sr-ind-card panel ' + toneCls + '" data-indicator="' + ind.key + '">' +
          '<div class="sr-ind-head">' +
            '<h3>' + esc(t(ind.title)) + '</h3>' +
            '<span class="sr-ind-badge ' + toneCls + '">' + icon + ' ' + esc(t(ind.status)) + '</span>' +
          '</div>' +
          '<p>' + esc(t(ind.detail)) + '</p>' +
        '</article>'
      );
    }).join('');

    const doorRisk = sim.doorFrameBehavioralRisk;
    const doorTone = doorRisk.favorable ? 'is-favorable' : 'is-vulnerable';
    const doorBlock =
      '<article class="sr-behavior-card panel ' + doorTone + '" id="srDoorMythCard" data-indicator="doorFrameMythRisk">' +
        '<div class="sr-ind-head">' +
          '<h3>' + esc(t(doorRisk.title)) + '</h3>' +
          '<span class="sr-ind-badge ' + doorTone + '">' + (doorRisk.favorable ? '✓ ' : '⚠ ') + esc(t(doorRisk.status)) + '</span>' +
        '</div>' +
        '<p>' + esc(t(doorRisk.detail)) + '</p>' +
      '</article>';

    const breakdownGrid =
      '<div class="sr-breakdown-grid">' +
        '<div class="panel sr-b-box is-conserved">' +
          '<h4>● ' + tr('Medidas válidas conservadas', 'Valid measures conserved') + ' (' + ev.conserved.length + '/3)</h4>' +
          renderItemList(ev.conserved, 'Ninguna medida válida conservada.', 'No valid measures conserved.') +
        '</div>' +
        '<div class="panel sr-b-box is-neutralized">' +
          '<h4>✓ ' + tr('Trampas neutralizadas', 'Neutralized traps') + ' (' + ev.neutralized.length + '/2)</h4>' +
          renderItemList(ev.neutralized, 'Ninguna trampa neutralizada.', 'No traps neutralized.') +
        '</div>' +
        '<div class="panel sr-b-box is-critical-error">' +
          '<h4>✕ ' + tr('Errores críticos cometidos', 'Critical errors committed') + ' (' + ev.criticalErrors.length + ')</h4>' +
          renderItemList(ev.criticalErrors, 'Sin errores críticos.', 'No critical errors.') +
        '</div>' +
        '<div class="panel sr-b-box is-active-trap">' +
          '<h4>⚠ ' + tr('Trampas que permanecen activas', 'Traps remaining active') + ' (' + ev.activeTraps.length + ')</h4>' +
          renderItemList(ev.activeTraps, 'Sin trampas activas.', 'No active traps.') +
        '</div>' +
      '</div>';

    const simActions =
      '<div class="actions sr-stage-actions">' +
        btn(
          tr('Continuar con el cierre', 'Continue to closing') + ' →',
          'continueToClosing()',
          'primary',
          'id="srClosingBtn"' + (state.survival.closingOpen ? ' disabled' : '')
        ) +
        btn(tr('Volver a Validación', 'Back to Validation'), 'go(5)') +
        btn(tr('Reiniciar Survival Run', 'Reset Survival Run'), 'timerReset(true)') +
        (!state.survival.closingOpen ? '<span class="small">' + tr('[Espacio]: continuar con el cierre', '[Space]: continue to closing') + '</span>' : '') +
      '</div>';

    const closingSection = state.survival.closingOpen
      ? '<section id="cierre" class="sr-closing panel" aria-labelledby="closingTitle">' +
          '<div class="eyebrow">' + tr('Sección final de la presentación', 'Final section of the presentation') + '</div>' +
          '<h3 tabindex="-1" id="closingTitle">' + tr('Síntesis final: suelo, estructuras y decisiones basadas en evidencia', 'Final synthesis: ground, structures and evidence-based decisions') + '</h3>' +
          p(tr(
            'La evidencia analizada en el laboratorio y en los expedientes reales (Loma Prieta 1989 y Christchurch 2011) confirma que los daños sísmicos dependen tanto del comportamiento del terreno y la calidad estructural como de protocolos de emergencia técnicamente rigurosos.',
            'Evidence from the laboratory and real case studies (Loma Prieta 1989 and Christchurch 2011) confirms that seismic damage depends on ground behaviour, structural quality and technically sound emergency protocols.'
          )) +
          box('flat',
            h(tr('Última ronda: 20 segundos por equipo', 'Final round: 20 seconds per team')) +
            p(tr('«Antes pensábamos ___. Ahora sostenemos ___, porque la evidencia ___.»', '“We used to think ___. Now we argue ___, because the evidence ___.”'), 'quote')
          ) +
          box('actions',
            btn(tr('Descargar informe de la misión', 'Download mission report'), 'downloadReport()', 'primary') +
            btn(tr('Investigación completa', 'Full research paper'), 'openPaper()') +
            btn(tr('Fuentes documentales', 'Documentary sources'), 'openSources()') +
            btn(tr('Nueva clase', 'New class'), 'resetMission()')
          ) +
          p(storageAvailable
            ? tr('Las decisiones se guardan localmente en este navegador. El informe registra la evaluación didáctica, no predicciones reales de daños.', 'Decisions are stored locally in this browser. The report records the educational assessment, not real damage predictions.')
            : tr('El navegador no permite guardar el progreso local. Descargá el informe antes de cerrar.', 'This browser blocks local storage. Download the report before closing.'),
            'small'
          ) +
        '</section>'
      : '';

    return (
      head(
        tr('06 / Survival Run · Simulación de impacto urbano', '06 / Survival Run · Urban impact simulation'),
        tr('Balance y consecuencias sísmicas', 'Seismic balance and consequences'),
        tr('Estado hipotético postevento calculado de forma determinista a partir del plan evaluado.', 'Hypothetical post-event status deterministically computed from the evaluated plan.')
      ) +
      scoreHero +
      '<h3 class="sr-section-heading">' + tr('Indicadores independientes del escenario postevento', 'Independent post-event scenario indicators') + '</h3>' +
      '<div class="sr-indicators-grid">' + indicatorsHtml + '</div>' +
      doorBlock +
      breakdownGrid +
      simActions +
      closingSection
    );
  }
];

render();
</script></body></html>
